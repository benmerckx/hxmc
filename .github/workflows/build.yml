# Builds everything from source with node and hxmc (docs/development.md, "Building")
# and tests it on a machine of each target (docs/testing.md, "CI"):
#
# - changes: what the run needs (.github/select.sh): everything, except on a
#   branch whose changes since the last checked commit are only docs (*.md)
#   or site/ (the site and the playground); main, tags, the nightly schedule
#   and dispatches always run everything. Also whether the release
#   rt-<hash of hxmc/deps> exists (hxmc/bootstrap/rt.mjs).
# - rt-build, rt: only when that release is missing: the runtime objects of
#   the six targets, Linux's glibc mode and Android (hxmc/deps with mbedtls and libuv,
#   built by zig), one job per target, then assembled, their layouts checked,
#   published as the release from pushes to main and hxmc and passed on as an
#   artifact (the jobs below otherwise download the release: make rt).
# - build: the committed stage0 module under node builds the tool, which
#   rebuilds itself (the fixpoint: with the module cache cold, warm and off),
#   the module cache's store and gate are checked, the dev loop (make
#   dev-check); then the port's release binaries and lix for the six targets.
#   Next to it, each with its own tool from the stage0 (make hxmc):
#   - corpus: hxmc's corpus for every target (in three jobs), the native
#     compiler (`haxe` with hxmc built in) for the six targets, the port as
#     a WebAssembly module, the reference's self-compile (lix downloads the
#     reference compiler, the nightly of the pinned upstream commit, cached);
#   - crosshost (two jobs): the tool as a WebAssembly module building the
#     corpus and itself byte-identical; the second also -D hxmc.wasm-gc's
#     programs as WasmGC modules under node (make wasmgc-check);
#   - npm-pack: the npm packages (with the compiler as a WebAssembly module;
#     built with the module cache off);
#   - site: the website (site/: plain pages, their scripts, the playground's
#     compiler, lix, the benchmark history);
#   - android: the APKs for android-arm64 and android-x86_64 checked (make
#     android-check: AndroidHello, AndroidViews), shared libraries (make
#     shared-check), then AndroidHello on an x86-64 emulator (make
#     android-device-check: its line in logcat; not required yet:
#     continue-on-error).
#   - ios: the app bundles for ios-arm64 and ios-sim-arm64 checked, then
#     (ios-simulator, on a macOS runner) IosHello on an iPhone simulator (make
#     ios-sim-check; not required yet: continue-on-error).
# - conformance: the port against the reference (make test LANES=..., make
#   test-fuzz LANE=..., on the release binary's Eval): HXB of the upstream
#   suites, macro and library cases (and hxmc's -lib resolution against
#   haxelib and lix), the port's unit tests, display requests,
#   the compilation server and its JSON-RPC methods, upstream's target suites
#   compiled by both and compared file by file, the Eval debugger and the
#   fuzzer's lanes, the last two in shards (haxe/test).
# - fuzz-exec: the fuzzer's exec lanes, one job each (with its own tool from
#   the stage0): random programs run by the reference's Eval and built by
#   hxmc (native, wasm32-wasi), their output compared.
# - upstream-suites: upstream's runtime suites (tests/unit, sys, threads)
#   built by hxmc and run, natively and (unit) as a wasm32-wasi module under
#   node, a job each (with its own tool from the stage0; make upstream-suites).
# - test: on each target's machine, the release binary's smoke test (with a
#   TLS handshake and libuv), lix, hxmc's corpus and the port's self-compile;
#   then the Mir lane: the compiler with Mir macros and --run running the
#   corpus in itself, the macro cases against the reference, and a benchmark
#   macro and the formatter's build timed against Eval.
# - wasm: the corpus and the port's self-compile under node and wasmtime;
#   playground: the website in Chromium, Firefox and WebKit (make site-check).
# - npm: the seven packages (@hxmc/cli and its six platform packages, each
#   with the compiler and the runtime objects of its machine) installed from
#   their tarballs in fresh projects on each target's machine: native at once,
#   -lib (lix's scopes, node_modules, haxelib), --ignore-scripts; on
#   linux-x64 a cross build with another platform package (--force) and
#   without; and on linux-x64 (on all six on main, tags and nightly, before
#   publish-npm) lix; publish-npm publishes them on v* tags and (as
#   nightlies) from main.
# - upstream-tests: upstream's compiler-side suite (RunCi macro) with the
#   release binaries as haxe (upstream-tests.yml).
# - release: a rolling `nightly` pre-release on pushes to main, a release on
#   v* tags; pages: the website on pushes to main (with the benchmark history
#   of the bench-data branch, which bench.yml writes).
# Each job names in `needs` only what it uses; publish-npm, release and pages
# wait for every check. The jobs' `if` test each direct need by name (a job
# skipped by `changes`, or rt when the release exists, would otherwise skip
# everything after it; and at job level needs.*.result also holds such a
# skipped job further up).
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  # nightly: everything, the npm packages on all six machines (publishes nothing)
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# a newer push to a branch cancels its run; main (which publishes), hxmc
# (which publishes the runtime objects), tags and the nightly run to the end
concurrency:
  group: build-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/hxmc' && !startsWith(github.ref, 'refs/tags/') }}

env:
  WASMTIME_VERSION: 38.0.1
  # the directory the port's self-compile runs in, on Linux (the reference)
  # and on macOS: the archive names files by absolute path
  SELF_ROOT: /Users/runner/hih
  TARGETS: linux-x86_64 linux-arm64 windows-x86_64 windows-arm64 macos-x86_64 macos-arm64

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      all: ${{ steps.select.outputs.all }}
      web: ${{ steps.select.outputs.web }}
      # anything that builds (and needs the runtime objects)
      build: ${{ steps.select.outputs.all == 'true' || steps.select.outputs.web == 'true' }}
      # the npm job's full set on all six machines
      npm_full: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
      rt_hit: ${{ steps.rt.outputs.hit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - name: What changed
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          REPO: ${{ github.repository }}
        run: sh .github/select.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: The published runtime objects
        id: rt
        run: |
          set -ex
          echo "hash=$(node hxmc/bootstrap/rt.mjs hash)" >> "$GITHUB_OUTPUT"
          if node hxmc/bootstrap/rt.mjs fetch bin/hxmc/rt; then echo "hit=true" >> "$GITHUB_OUTPUT"; else echo "hit=false" >> "$GITHUB_OUTPUT"; fi

  # the runtime objects of one target (and linux-x86_64's, which the tool
  # that assembles the others links), when rt-<hash> is missing
  rt-build:
    needs: changes
    if: needs.changes.outputs.rt_hit != 'true' && needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x86_64, linux-arm64, windows-x86_64, windows-arm64, macos-x86_64, macos-arm64, linux-x86_64-glibc, linux-arm64-glibc, android-arm64, android-x86_64]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: zig
        run: echo "version=$(cat hxmc/deps/zig-version)" >> "$GITHUB_OUTPUT"
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig.outputs.version }}
      - name: System packages
        run: sudo apt-get install -qqy lld llvm
      - name: Cache mbedtls and libuv
        uses: actions/cache@v6
        with:
          path: bin/hxmc/deps
          key: hxmc-deps-zig-${{ steps.zig.outputs.version }}-${{ hashFiles('hxmc/deps/deps.sh') }}-${{ matrix.target }}
      - name: Build the runtime objects with zig
        run: make rt-target RT_TARGET=${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: rt-${{ matrix.target }}
          path: |
            bin/hxmc/rt/LICENSE.*
            bin/hxmc/rt/${{ matrix.target }}/*.o
            bin/hxmc/deps/${{ matrix.target }}/VERSIONS
            bin/hxmc/deps/${{ matrix.target }}/include
          retention-days: 1

  # the ten targets' objects together: the committed layouts checked
  # against every target's headers, published as rt-<hash> (from main and
  # hxmc), passed on as the artifact rt
  rt:
    needs: [changes, rt-build]
    if: ${{ !cancelled() && needs.rt-build.result != 'skipped' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Every target built
        run: test "${{ needs.rt-build.result }}" = success
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: rt
        run: |
          echo "hash=$(node hxmc/bootstrap/rt.mjs hash)" >> "$GITHUB_OUTPUT"
          echo "zig=$(cat hxmc/deps/zig-version)" >> "$GITHUB_OUTPUT"
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.rt.outputs.zig }}
      - uses: actions/download-artifact@v8
        with:
          pattern: rt-*
          path: bin/hxmc
          merge-multiple: true
      # the tool comes from the stage0 module (with linux-x86_64's object)
      - name: Layouts and HASH
        run: |
          set -ex
          touch bin/hxmc/deps/*/VERSIONS bin/hxmc/rt/*/*.o
          ls -l bin/hxmc/rt/*
          make rt-layouts
      - name: Publish rt-${{ steps.rt.outputs.hash }}
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/hxmc')
        run: |
          set -ex
          node hxmc/bootstrap/rt.mjs pack bin/hxmc/rt dist/rt
          gh release create "rt-${{ steps.rt.outputs.hash }}" --target "$GITHUB_SHA" --prerelease \
            --title "hxmc runtime objects ${{ steps.rt.outputs.hash }}" \
            --notes "hxmc's runtime objects (rt.o, ssl.o, uv.o) for the six targets, the glibc mode of Linux and Android, built by zig ${{ steps.rt.outputs.zig }} from hxmc/deps at $GITHUB_SHA; downloaded by hxmc/bootstrap/rt.mjs." dist/rt/*
      - uses: actions/upload-artifact@v7
        with:
          name: rt
          path: |
            bin/hxmc/rt/HASH
            bin/hxmc/rt/LICENSE.*
            bin/hxmc/rt/*/*.o
          retention-days: 7

  # the tool from the committed stage0 (docs/development.md, "Building"): node runs it
  # to build the first native tool, which builds the tool from source; the
  # tool rebuilt by itself does not change. Then the release binaries and lix.
  build:
    needs: [changes, rt]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.rt.result == 'success' || needs.rt.result == 'skipped') && needs.changes.outputs.all == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.rt_hit != 'true'
        with: {name: rt, path: bin/hxmc/rt}
      - name: Runtime objects
        run: make rt && touch bin/hxmc/rt/*/*.o && ls -l bin/hxmc/rt/*
      - name: Bootstrap from the stage0
        run: make bootstrap
      # the module cache's store (hxmc/src/hxmc/CacheDir.hx): tool
      # directories, the trim, a cache that cannot be written
      - name: Module cache store
        run: bin/hxmc/hxmc -cp hxmc/test -cp haxe/test --run CacheCheck
      # the persistent module cache: the same outputs with and without it
      # (hxmc/src/hxmc/ModuleCache.hx, hxmc/test/ModuleCacheCheck.hx)
      - name: Module cache
        run: make test-module-cache PORT=1
      # `hxmc dev` on a console program, the compilation server's builds
      # against fresh ones (hxmc/test/dev)
      - name: The dev loop
        run: make dev-check

      - name: The port's release binaries
        run: |
          set -ex
          for t in $TARGETS; do make release TARGET=$t; done
          ls -l bin/release/*
      - name: lix for the six targets
        run: make lix-dist

      - name: Package the release binaries
        run: |
          set -ex
          mkdir -p dist
          for t in $TARGETS; do
            os=${t%-*}
            case $t in *-arm64) arch=aarch64 ;; *) arch=x86_64 ;; esac
            P=hxmc-haxe-$os-$arch
            exe=; [ $os = windows ] && exe=.exe
            mkdir -p "pkg/$P"
            cp bin/release/$t/haxe$exe LICENSE COPYING bin/hxmc/rt/LICENSE.mbedtls bin/hxmc/rt/LICENSE.libuv "pkg/$P/"
            cp -r haxe/upstream/std "pkg/$P/std"
            if [ $os = windows ]; then
              printf '%s\r\n' \
                "haxe: the Haxe compiler ported to Haxe, built by hxmc (https://github.com/$GITHUB_REPOSITORY)." \
                "Commit $GITHUB_SHA, target $t (with mbedtls and libuv)." "" \
                "Use it like haxe.exe, with HAXE_STD_PATH pointing at the std directory next to it:" \
                "  set HAXE_STD_PATH=%CD%\\std" \
                "  haxe.exe -main Main --interp" > "pkg/$P/README.txt"
              (cd pkg && zip -qr -9 "../dist/$P.zip" "$P")
            else
              printf '%s\n' \
                "haxe: the Haxe compiler ported to Haxe, built by hxmc (https://github.com/$GITHUB_REPOSITORY)." \
                "Commit $GITHUB_SHA, target $t (with mbedtls and libuv)." "" \
                "Use it like haxe, with HAXE_STD_PATH pointing at the std directory next to it:" \
                "  export HAXE_STD_PATH=\$PWD/std" \
                "  ./haxe -main Main --interp" \
                "macOS: a browser download is quarantined; xattr -d com.apple.quarantine haxe" > "pkg/$P/README.txt"
              tar czf "dist/$P.tar.gz" -C pkg "$P"
            fi
          done
          ls -l dist

      - uses: actions/upload-artifact@v7
        with: {name: hxmc-haxe-linux-x86_64, path: dist/hxmc-haxe-linux-x86_64.tar.gz, retention-days: 14}
      - uses: actions/upload-artifact@v7
        with: {name: hxmc-haxe-linux-aarch64, path: dist/hxmc-haxe-linux-aarch64.tar.gz, retention-days: 14}
      - uses: actions/upload-artifact@v7
        with: {name: hxmc-haxe-macos-x86_64, path: dist/hxmc-haxe-macos-x86_64.tar.gz, retention-days: 14}
      - uses: actions/upload-artifact@v7
        with: {name: hxmc-haxe-macos-aarch64, path: dist/hxmc-haxe-macos-aarch64.tar.gz, retention-days: 14}
      - uses: actions/upload-artifact@v7
        with: {name: hxmc-haxe-windows-x86_64, path: dist/hxmc-haxe-windows-x86_64.zip, retention-days: 14}
      - uses: actions/upload-artifact@v7
        with: {name: hxmc-haxe-windows-aarch64, path: dist/hxmc-haxe-windows-aarch64.zip, retention-days: 14}
      - uses: actions/upload-artifact@v7
        with: {name: lix, path: bin/lix-dist/, retention-days: 14}

  # hxmc's corpus for every target (make corpus-stage; run by the test and
  # wasm jobs on the targets' machines), in three groups of about the same
  # time; with the WebAssembly ones the port as a WebAssembly module (the wasm
  # job) and the reference's self-compile (the test and wasm jobs compare
  # with it)
  corpus:
    needs: [changes, rt]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.rt.result == 'success' || needs.rt.result == 'skipped') && needs.changes.outputs.all == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: unix, targets: linux-x86_64 linux-arm64 linux-x86_64-glibc linux-arm64-glibc macos-x86_64 macos-arm64}
          - {group: windows, targets: windows-x86_64 windows-arm64}
          - {group: wasm, targets: wasm32-wasi wasm32-wasi-legacy}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # (zig: the C companions of corpus cases, Corpus.nativeInputs)
      - id: zig
        run: echo "version=$(cat hxmc/deps/zig-version)" >> "$GITHUB_OUTPUT"
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig.outputs.version }}
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.rt_hit != 'true'
        with: {name: rt, path: bin/hxmc/rt}
      - name: Runtime objects and the tool
        run: |
          set -ex
          make rt && touch bin/hxmc/rt/*/*.o
          make hxmc
      - name: Cross-build hxmc's corpus
        run: make corpus-stage CORPUS_TARGETS="${{ matrix.targets }}"
      # the native compiler (the npm package's: Mir macros and --run) for each
      # target of the group (the test jobs run its Mir lane on the targets' machines)
      - name: Cross-build the native compiler
        if: matrix.group != 'wasm'
        run: |
          set -ex
          for t in ${{ matrix.targets }}; do
            exe=haxe; case $t in *-glibc) continue ;; windows-*) exe=haxe.exe ;; esac
            make bin/npm/native/$t/$exe
          done

      - name: The port as a WebAssembly module
        if: matrix.group == 'wasm'
        run: |
          set -ex
          mkdir -p bin/corpus/port
          HXMC_STATS=1 bin/hxmc/hxmc bin/corpus/port/haxe.wasm -cp haxe/src -main haxe.Main -D disable-parallelism -cp bin/hxmc/std --custom-target hxmc -D hxmc.target=wasm32-wasi | tail -3
          HXMC_STATS=1 bin/hxmc/hxmc bin/corpus/port/haxe-legacy.wasm -cp haxe/src -main haxe.Main -D disable-parallelism -cp bin/hxmc/std --custom-target hxmc -D hxmc.target=wasm32-wasi -D hxmc.wasm-eh=legacy | tail -3
          ls -l bin/corpus/port/haxe.wasm bin/corpus/port/haxe-legacy.wasm
      - name: Reference compiler revision
        if: matrix.group == 'wasm'
        id: ref
        run: echo "rev=$(git rev-parse --short=7 HEAD:haxe/upstream)" >> "$GITHUB_OUTPUT"
      - name: Cache the reference compiler
        if: matrix.group == 'wasm'
        uses: actions/cache@v6
        with:
          path: bin/reference
          key: reference-nightly-${{ steps.ref.outputs.rev }}
      # the reference's self-compile, in the directory the macOS runners use
      - name: Reference self-compile
        if: matrix.group == 'wasm'
        run: |
          set -ex
          make lix
          if [ ! -x bin/reference/haxe ]; then make reference; fi
          bin/reference/haxe -version
          sudo mkdir -p "$SELF_ROOT" && sudo chown "$USER" "$SELF_ROOT"
          cp -r haxe/src "$SELF_ROOT/src"
          cp -r haxe/upstream/std "$SELF_ROOT/std"
          (cd "$SELF_ROOT" && HAXE_STD_PATH=std "$GITHUB_WORKSPACE/bin/reference/haxe" -cp src -main haxe.Main -D disable-parallelism --interp --no-output --hxb self-ref.hxb)
          mkdir -p dist/self
          cp "$SELF_ROOT/self-ref.hxb" dist/self/
          # the sources as compiled here (a Windows checkout would have CRLF
          # line ends, and other positions)
          tar czf dist/self/std.tar.gz -C haxe/upstream std
          tar czf dist/self/src.tar.gz -C haxe src
      # what the test jobs' Mir lane needs besides the compiler, with Unix
      # line ends: hxmc's std, the std, the harnesses and the corpus, the
      # macro cases' projects, the benchmark's sources (MirBench --fetch)
      - name: The Mir lane's files
        if: matrix.group == 'wasm'
        run: |
          set -ex
          D=bin/mir-data
          mkdir -p $D/bin/hxmc $D/haxe/upstream/tests/misc/eval $D/hxmc
          cp -r bin/hxmc/std $D/bin/hxmc/std
          cp -r haxe/upstream/std $D/haxe/upstream/std
          cp -r haxe/upstream/tests/misc/eval/projects $D/haxe/upstream/tests/misc/eval/projects
          cp -r hxmc/test $D/hxmc/test
          cp -r haxe/test $D/haxe/test
          bin/hxmc/hxmc -cp hxmc/test -cp haxe/test --run MirBench --fetch $D/bench
          tar czf dist/self/mir-data.tar.gz -C $D .
          ls -l dist/self
      - uses: actions/upload-artifact@v7
        if: matrix.group == 'wasm'
        with: {name: hxmc-self, path: dist/self/, retention-days: 3}

      - name: Pack the corpus
        run: |
          set -ex
          mkdir -p dist/corpus
          for t in ${{ matrix.targets }}; do tar czf dist/corpus/corpus-$t.tar.gz -C bin/corpus/$t .; done
          for t in ${{ matrix.targets }}; do
            exe=haxe; case $t in windows-*) exe=haxe.exe ;; esac
            if [ -f bin/npm/native/$t/$exe ]; then tar czf dist/corpus/haxe-$t.tar.gz -C bin/npm/native/$t $exe; fi
          done
          if [ -d bin/corpus/port ]; then tar czf dist/corpus/corpus-wasm32-wasi-port.tar.gz -C bin/corpus/port haxe.wasm haxe-legacy.wasm; fi
          ls -l dist/corpus
      - uses: actions/upload-artifact@v7
        with: {name: 'corpus-${{ matrix.group }}', path: dist/corpus/, retention-days: 3}

  # hxmc's output does not depend on the host: the tool as a WebAssembly
  # module (under node) builds the corpus for every target, and the tool
  # itself, byte-identical to the native tool (make crosshost; the targets in
  # two jobs); the second job also checks -D hxmc.wasm-gc (make wasmgc-check:
  # hxmc/test/wasmgc's programs and corpus cases as WasmGC modules under node,
  # their output against the native build's)
  crosshost:
    needs: [changes, rt]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.rt.result == 'success' || needs.rt.result == 'skipped') && needs.changes.outputs.all == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {args: '--tool --targets linux-x86_64,linux-arm64,linux-x86_64-glibc,linux-arm64-glibc'}
          - {args: '--targets windows-x86_64,windows-arm64,macos-x86_64,macos-arm64,wasm32-wasi', wasmgc: true}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: zig
        run: echo "version=$(cat hxmc/deps/zig-version)" >> "$GITHUB_OUTPUT"
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig.outputs.version }}
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.rt_hit != 'true'
        with: {name: rt, path: bin/hxmc/rt}
      - name: Runtime objects and the tool
        run: |
          set -ex
          make rt && touch bin/hxmc/rt/*/*.o
          make hxmc
      - name: hxmc as a WebAssembly module, byte-identical output
        run: make crosshost CROSSHOST_ARGS="${{ matrix.args }}"
      - name: WasmGC
        if: matrix.wasmgc
        run: make wasmgc-check

  # the npm packages (packages/): @hxmc/cli and its six platform packages,
  # at one version: the tag's (v*), a nightly prerelease on main,
  # packages/cli/package.json's elsewhere
  npm-pack:
    needs: [changes, rt]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.rt.result == 'success' || needs.rt.result == 'skipped') && needs.changes.outputs.all == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.rt_hit != 'true'
        with: {name: rt, path: bin/hxmc/rt}
      - name: Runtime objects and the tool
        run: |
          set -ex
          make rt && touch bin/hxmc/rt/*/*.o
          make hxmc
      # (with the module cache off: the compilers of the packages typed from
      # source, the path the other jobs' builds no longer take)
      - name: The npm packages
        env:
          HXMC_MODULE_CACHE: '0'
        run: |
          set -ex
          v=$(node -p "require('./packages/cli/package.json').version")
          case "$GITHUB_REF" in
            refs/tags/v*) v=${GITHUB_REF_NAME#v} ;;
            refs/heads/main) v=$v-nightly.$(date -u +%Y%m%d).$(git rev-parse --short=7 HEAD) ;;
          esac
          make npm NPM_VERSION=$v
          echo "$v" > bin/npm/VERSION
          # -lib: lix's scopes, node_modules, haxelib (and the npm job's copy of the test)
          make test-libraries
          cp hxmc/test/Libraries.hx bin/npm/
          cat bin/npm/sizes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with: {name: npm, path: "bin/npm/*.tgz\nbin/npm/Libraries.hx\nbin/npm/VERSION\nbin/npm/sizes.md", retention-days: 7}

  # the website (site/, make site): its pages, their JavaScript, the
  # playground's WebAssembly, lix under tools/, the benchmark history and the
  # target generators' table from the bench-data branch (bench.yml)
  site:
    needs: [changes, rt]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.rt.result == 'success' || needs.rt.result == 'skipped') && (needs.changes.outputs.all == 'true' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.rt_hit != 'true'
        with: {name: rt, path: bin/hxmc/rt}
      - name: Runtime objects
        run: make rt && touch bin/hxmc/rt/*/*.o
      - name: The website
        # (off main and tags, the modules with their function names: a trap's
        # stack in the browser tests names its frames; the code is the same,
        # the names add about 8% gzipped, so the published site goes without)
        env:
          HXMC_SYMBOLS: ${{ (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')) && '1' || '' }}
        run: |
          set -ex
          make lix-dist
          mkdir -p bin/bench-data
          if git fetch --depth 1 origin bench-data; then git archive FETCH_HEAD | tar -x -C bin/bench-data; fi
          make site LIX_DIR=bin/lix-dist BENCH_DATA=bin/bench-data
          ls -l bin/site bin/site/tools
      - uses: actions/upload-artifact@v7
        with: {name: site, path: bin/site/, retention-days: 7}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: bin/site

  # Android (docs/hxmc.md, "Android"): the APKs hxmc writes for android-arm64
  # and android-x86_64, checked without a device (make android-check: zip,
  # manifest, ELF, v2 signature; the SDK's zipalign, aapt and apksigner),
  # and shared libraries (make shared-check), then AndroidHello.apk on an
  # x86-64 emulator with KVM (make android-device-check,
  # hxmc/test/android/android.sh: installed, launched, its line in logcat;
  # logcat as an artifact). Not a required check yet
  # (continue-on-error): emulators on hosted runners are slow to boot and
  # sometimes flaky.
  android:
    needs: [changes, rt]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.rt.result == 'success' || needs.rt.result == 'skipped') && needs.changes.outputs.all == 'true' }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.rt_hit != 'true'
        with: {name: rt, path: bin/hxmc/rt}
      - name: The APKs and their checks
        run: |
          set -ex
          make rt && touch bin/hxmc/rt/*/*.o
          export PATH="$PATH:$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          make android-check ANDROID_TARGET=android-arm64
          make android-check ANDROID_TARGET=android-x86_64
      - name: Shared libraries (glibc mode)
        run: make shared-check
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: AndroidHello on an emulator (x86-64, API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          # (the APKs of the step above: -o, not rebuilt)
          script: |
            make -o android-programs android-device-check ANDROID_TARGET=android-x86_64
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android
          path: |
            bin/android/android-x86_64/*.txt
            bin/android/*/*.apk
          retention-days: 7
          if-no-files-found: ignore

  # iOS (docs/hxmc.md, "iOS"): the app bundles hxmc writes for ios-sim-arm64
  # and ios-arm64 (IosHello, also as an .ipa), checked without a Mac (make
  # ios-check: Info.plist, Mach-O, the code signature; llvm-objdump), then
  # IosHello.app on an iPhone simulator of a macOS runner (ios-simulator:
  # make ios-sim-check, hxmc/test/ios/ios.sh: codesign --verify, its line on
  # stdout). Not
  # required checks yet (continue-on-error), as android.
  ios:
    needs: [changes, rt]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.rt.result == 'success' || needs.rt.result == 'skipped') && needs.changes.outputs.all == 'true' }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.rt_hit != 'true'
        with: {name: rt, path: bin/hxmc/rt}
      - name: The app bundles and their checks
        run: |
          set -ex
          make rt && touch bin/hxmc/rt/*/*.o
          make ios-check IOS_TARGET=ios-arm64
          make ios-check IOS_TARGET=ios-sim-arm64
          du -sh bin/ios/*/*.app bin/ios/*/*.ipa
          tar czf bin/ios.tar.gz -C bin ios
      - uses: actions/upload-artifact@v7
        with: {name: ios, path: bin/ios.tar.gz, retention-days: 7}

  ios-simulator:
    needs: [changes, ios]
    if: ${{ !cancelled() && needs.ios.result == 'success' }}
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 40
    steps:
      # (the Makefile comes with the root's files; the bundle from the ios job:
      # -o, not rebuilt)
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            hxmc/test/ios
      - uses: actions/download-artifact@v8
        with: {name: ios, path: dl}
      - name: IosHello on an iPhone simulator
        run: |
          set -ex
          mkdir -p bin && tar xzf dl/ios.tar.gz -C bin
          xcodebuild -version
          make -o ios-programs ios-sim-check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-simulator
          path: |
            bin/ios/ios-sim-arm64/*.txt
          retention-days: 7
          if-no-files-found: ignore

  # the port against the reference compiler (docs/testing.md): make test
  # LANES=<suite> and make test-fuzz LANE=<lane>, as locally, on the release
  # binary's Eval (EVAL, FUZZ: the job has no tool); the Eval debugger in
  # shards (SHARD: EvalDebugger --shard), the fuzzer's diff lanes (the
  # targets that need no library) split across three jobs
  conformance:
    needs: [changes, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.changes.outputs.all == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: hxb macro hxblib haxelib libs unit}
          - {suite: display server jsonrpc}
          - {suite: targets}
          - {suite: debugger, shard: 1/3}
          - {suite: debugger, shard: 2/3}
          - {suite: debugger, shard: 3/3}
          - {suite: fuzz, lanes: 'diff:hxb diff:interp diff:js diff:python'}
          - {suite: fuzz, lanes: 'diff:lua diff:php diff:hlc'}
          - {suite: fuzz, lanes: 'diff:neko diff:hl diff:swf'}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with: {name: hxmc-haxe-linux-x86_64, path: dl}
      - uses: actions/download-artifact@v8
        with: {name: lix, path: dl/lix}
      - name: Reference compiler revision
        id: ref
        run: echo "rev=$(git rev-parse --short=7 HEAD:haxe/upstream)" >> "$GITHUB_OUTPUT"
      - name: Cache the reference compiler
        uses: actions/cache@v6
        with:
          path: bin/reference
          key: reference-nightly-${{ steps.ref.outputs.rev }}
      - name: The port, lix and the reference
        run: |
          set -ex
          mkdir -p bin/port bin/lix
          tar xzf dl/hxmc-haxe-linux-x86_64.tar.gz -C dl
          cp dl/hxmc-haxe-linux-x86_64/haxe bin/port/haxe
          cp dl/lix/lix-linux-x86_64 bin/lix/lix && chmod +x bin/lix/lix bin/port/haxe
          for cmd in haxe haxelib neko; do ln -sf lix bin/lix/$cmd; done
          touch -d '2000-01-01' bin/lix/lix
          if [ ! -x bin/reference/haxe ]; then make -o bin/lix/lix reference; fi
          bin/reference/haxe -version
          bin/port/haxe -version
      - name: ${{ matrix.suite }} ${{ matrix.shard }}
        run: |
          set -x
          # (the port, the reference and lix are in place: -o, not rebuilt)
          M="make -o bin/port/haxe -o bin/reference/haxe -o bin/lix/lix JOBS=4 EVAL=bin/port/haxe"
          if [ "${{ matrix.suite }}" = fuzz ]; then
            failed=
            for lane in ${{ matrix.lanes }}; do
              $M test-fuzz LANE=$lane N=100 FUZZ="bin/port/haxe -cp haxe/test/fuzz -cp haxe/test --run Fuzz" || failed="$failed $lane"
            done
            if [ -n "$failed" ]; then echo "failed:$failed"; exit 1; fi
          else
            $M test LANES="${{ matrix.suite }}" SHARD="${{ matrix.shard }}" SUMMARY="$GITHUB_STEP_SUMMARY"
          fi
      # the reference still compiles the port's own sources, the outputs
      # identical (the nightly's target generators, haxe/test/Targets.hx
      # --strict, on two rows: hl for the generator's typing, neko for its
      # bytecode compiler), sequential, one run
      - name: The port's sources with the reference (Targets, self -> hl, neko)
        if: ${{ !cancelled() && matrix.suite == 'targets' }}
        run: |
          set -ex
          ulimit -s unlimited
          HAXE_STD_PATH=$PWD/haxe/upstream/std bin/port/haxe -cp haxe/test --run Targets --strict -p self -t hl,neko -n 1 --modes seq

  # the fuzzer's exec lanes (docs/testing.md): the kept programs and a random
  # batch run by the reference's Eval and built by hxmc (a native executable,
  # a wasm32-wasi module under node), what they print compared; one job per
  # lane, each with its own tool from the stage0
  fuzz-exec:
    needs: [changes, rt]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.rt.result == 'success' || needs.rt.result == 'skipped') && needs.changes.outputs.all == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lane: ['exec:interp,hxmc', 'exec:interp,hxmc-wasm']
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.rt_hit != 'true'
        with: {name: rt, path: bin/hxmc/rt}
      - name: Reference compiler revision
        id: ref
        run: echo "rev=$(git rev-parse --short=7 HEAD:haxe/upstream)" >> "$GITHUB_OUTPUT"
      - name: Cache the reference compiler
        uses: actions/cache@v6
        with:
          path: bin/reference
          key: reference-nightly-${{ steps.ref.outputs.rev }}
      - name: Runtime objects, the tool and the reference
        run: |
          set -ex
          make rt && touch bin/hxmc/rt/*/*.o
          make hxmc
          if [ ! -x bin/reference/haxe ]; then make lix reference; fi
          bin/reference/haxe -version
      - name: ${{ matrix.lane }}
        run: |
          set -x
          export HAXE_REFERENCE=$PWD/bin/reference/haxe
          ulimit -s unlimited
          F="bin/hxmc/hxmc -cp haxe/test/fuzz -cp haxe/test --run Fuzz -j 4 --lane ${{ matrix.lane }}"
          failed=
          $F --cases haxe/test/fuzz/cases || failed="$failed cases"
          $F -n 400 || failed="$failed random"
          if [ -n "$failed" ]; then echo "failed:$failed"; exit 1; fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with: {name: "fuzz-${{ strategy.job-index }}", path: "bin/test/fuzz/failures/", retention-days: 7, if-no-files-found: ignore}

  # upstream's runtime suites built by hxmc and run (make upstream-suites,
  # hxmc/test/UpstreamSuites.hx): unit, sys and threads natively, unit as a
  # wasm32-wasi module under node; the counts in the job summary
  upstream-suites:
    needs: [changes, rt]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.rt.result == 'success' || needs.rt.result == 'skipped') && needs.changes.outputs.all == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [native, wasm32-wasi]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.rt_hit != 'true'
        with: {name: rt, path: bin/hxmc/rt}
      - name: Runtime objects, the tool and lix
        run: |
          set -ex
          make rt && touch bin/hxmc/rt/*/*.o
          make hxmc lix
      - name: Upstream's suites (${{ matrix.target }})
        run: make upstream-suites SUITES_TARGET=${{ matrix.target }}
        timeout-minutes: 30
      - uses: actions/upload-artifact@v7
        if: failure()
        with: {name: "upstream-suites-${{ matrix.target }}", path: "bin/test/upstream-suites/*/*/*.log", retention-days: 7, if-no-files-found: ignore}

  # on a machine of each target: the release binary, lix, hxmc's corpus and
  # the port's self-compile; the scripts run on the release binary's Eval
  test:
    needs: [changes, build, corpus]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.corpus.result == 'success' && needs.changes.outputs.all == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x86_64, pkg: linux-x86_64, corpus: unix, os: ubuntu-24.04}
          - {target: linux-arm64, pkg: linux-aarch64, corpus: unix, os: ubuntu-24.04-arm}
          - {target: windows-x86_64, pkg: windows-x86_64, corpus: windows, os: windows-2025}
          - {target: windows-arm64, pkg: windows-aarch64, corpus: windows, os: windows-11-arm}
          - {target: macos-x86_64, pkg: macos-x86_64, corpus: unix, os: macos-15-intel}
          - {target: macos-arm64, pkg: macos-aarch64, corpus: unix, os: macos-15}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            hxmc/test
            haxe/test
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with: {name: 'hxmc-haxe-${{ matrix.pkg }}', path: dl}
      - uses: actions/download-artifact@v8
        with: {name: 'corpus-${{ matrix.corpus }}', path: dl}
      - uses: actions/download-artifact@v8
        with: {name: hxmc-self, path: dl}
      - uses: actions/download-artifact@v8
        with: {name: lix, path: lix}
      - name: Unpack
        id: unpack
        run: |
          set -ex
          mkdir -p t corpus std-x
          case "${{ matrix.target }}" in
            windows-*)
              unzip -q dl/hxmc-haxe-${{ matrix.pkg }}.zip -d t
              echo "bin=$PWD/t/hxmc-haxe-${{ matrix.pkg }}/haxe.exe" >> "$GITHUB_OUTPUT"
              # a Windows path (C:/...) for the native program
              echo "std=$(cygpath -m "$PWD/t/hxmc-haxe-${{ matrix.pkg }}/std")" >> "$GITHUB_OUTPUT" ;;
            *)
              tar xzf dl/hxmc-haxe-${{ matrix.pkg }}.tar.gz -C t
              echo "bin=$PWD/t/hxmc-haxe-${{ matrix.pkg }}/haxe" >> "$GITHUB_OUTPUT"
              echo "std=$PWD/t/hxmc-haxe-${{ matrix.pkg }}/std" >> "$GITHUB_OUTPUT" ;;
          esac
          tar xzf dl/corpus-${{ matrix.target }}.tar.gz -C corpus
          tar xzf dl/std.tar.gz -C std-x
          tar xzf dl/src.tar.gz -C std-x
          ls -l t/*
      - name: Smoke test
        run: |
          export HAXE_STD_PATH="${{ steps.unpack.outputs.std }}"
          SMOKE_DIR="$RUNNER_TEMP/smoke" sh hxmc/test/smoke.sh "${{ steps.unpack.outputs.bin }}"
      - name: Smoke test (PowerShell, Windows paths)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:HAXE_STD_PATH = (Resolve-Path "t/hxmc-haxe-${{ matrix.pkg }}/std").Path
          $exe = (Resolve-Path "t/hxmc-haxe-${{ matrix.pkg }}/haxe.exe").Path
          New-Item -ItemType Directory -Force ps | Out-Null
          Set-Location ps
          Set-Content Main.hx 'class Main { static function main() { trace("hello from " + #if sys Sys.systemName() + " in " + Sys.getCwd() #else "js" #end); } }'
          $out = & $exe -main Main --interp
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $out
          # the native build's Eval host: Windows, with a drive letter
          if (-not ($out -match "hello from Windows in [A-Z]:\\")) { exit 1 }
          & $exe -main Main --js out.js
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node out.js
          & $exe -cp . -main Main --hxb out.hxb
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item out.hxb
      - name: lix
        run: |
          set -ex
          # installed as the site says: the platform's binary as lix, then lix shims
          # (a POSIX path for bash: on Windows, MSYS converts PATH for native programs)
          B="$RUNNER_TEMP/lix-bin"
          if [ "$RUNNER_OS" = Windows ]; then B=$(cygpath -u "$B"); fi
          mkdir -p "$B"
          if [ "$RUNNER_OS" = Windows ]; then
            cp lix/lix-${{ matrix.target }}.exe "$B/lix.exe"; L="$B/lix.exe"; H="$B/haxe.exe"
          else
            cp lix/lix-${{ matrix.target }} "$B/lix"; chmod +x "$B/lix"; L="$B/lix"; H="$B/haxe"
          fi
          "$L" --version
          "$L" shims
          ls -l "$B"
          # the commands on PATH (the libraries' install commands call lix)
          export PATH="$B:$PATH"
          export HAXESHIM_ROOT="$RUNNER_TEMP/lix-root"
          mkdir -p "$RUNNER_TEMP/lix-project/src" && cd "$RUNNER_TEMP/lix-project"
          "$L" scope create
          # downloads from GitHub's and haxe.org's servers stall now and then on the
          # runners (no data for 30 s, or a TCP timeout): tried again, as a person would
          retry() { for n in 1 2 3; do "$@" && return 0; echo "retry: $* failed (try $n)"; sleep 10; done; return 1; }
          # Haxe and neko have no Windows ARM64 builds, and lix (as upstream's)
          # maps no platform there ("Unsupported platform: unknown"): no downloads
          if [ "${{ matrix.target }}" = windows-arm64 ]; then exit 0; fi
          retry "$L" download
          retry "$L" install haxelib:tink_core
          cat haxe_libraries/tink_core.hxml .haxerc
          # a fresh clone's case: the libraries reinstalled from haxe_libraries
          retry "$L" install haxelib:tink_json
          rm -rf "$HAXESHIM_ROOT/haxe_libraries"
          retry "$L" download
          echo 'class Main { static function main() trace(tink.core.Outcome.Success(#if sys Sys.args() #else "js" #end)); }' > src/Main.hx
          # Haxe 4.3.7 has no Linux ARM64 build: lix (as the npm package)
          # downloads the x86-64 one there, which does not run
          if [ "${{ matrix.target }}" = linux-arm64 ]; then "$H" --run resolve-args -lib tink_json; exit 0; fi
          # ("stable" in .haxerc: the version looked up on haxe.org first)
          retry "$H" -version
          "$H" --run resolve-args -lib tink_core
          "$H" --run resolve-args -lib tink_json
          "$H" -cp src -lib tink_core --run Main a b
          "$H" -cp src -lib tink_core -main Main --js main.js && node main.js
      - name: Corpus
        if: always()
        run: |
          export HAXE_STD_PATH="${{ steps.unpack.outputs.std }}"
          "${{ steps.unpack.outputs.bin }}" -cp hxmc/test -cp haxe/test --run Check corpus --summary "$GITHUB_STEP_SUMMARY"
      # the free nursery filled with a pattern: allocations that are not
      # initialized and references a collection missed read it at once
      - name: Corpus, RT_VERIFY=1
        if: always()
        run: |
          export HAXE_STD_PATH="${{ steps.unpack.outputs.std }}"
          RT_VERIFY=1 "${{ steps.unpack.outputs.bin }}" -cp hxmc/test -cp haxe/test --run Check corpus --summary "$GITHUB_STEP_SUMMARY"
      # a debugger on a -debug build (DebugCheck --run: a breakpoint at a Haxe
      # line, the backtrace's Haxe functions and lines): gdb on Linux, lldb on
      # macOS; Windows: the unwind tables through the corpus (UnwindTables)
      - name: Debugger
        if: always() && runner.os != 'Windows'
        run: |
          set -ex
          if [ "$RUNNER_OS" = Linux ] && ! command -v gdb > /dev/null; then sudo apt-get install -qqy gdb; fi
          export HAXE_STD_PATH="${{ steps.unpack.outputs.std }}"
          "${{ steps.unpack.outputs.bin }}" -cp hxmc/test -cp haxe/test --run DebugCheck --run corpus/_debug
      # Linux: the corpus in the dynamic glibc mode (-D hxmc.libc=glibc) against
      # the runner's glibc, and against glibc 2.17, the floor its symbol
      # versions are pinned to (CentOS 7's, in a container; the release
      # binary that runs the check is static)
      - name: Corpus, glibc mode
        if: always() && runner.os == 'Linux'
        run: |
          set -ex
          mkdir -p corpus-glibc
          tar xzf dl/corpus-${{ matrix.target }}-glibc.tar.gz -C corpus-glibc
          export HAXE_STD_PATH="${{ steps.unpack.outputs.std }}"
          "${{ steps.unpack.outputs.bin }}" -cp hxmc/test -cp haxe/test --run ElfCheck corpus-glibc
          "${{ steps.unpack.outputs.bin }}" -cp hxmc/test -cp haxe/test --run Check corpus-glibc --summary "$GITHUB_STEP_SUMMARY"
          RT_VERIFY=1 "${{ steps.unpack.outputs.bin }}" -cp hxmc/test -cp haxe/test --run Check corpus-glibc --summary "$GITHUB_STEP_SUMMARY"
      - name: Corpus, glibc mode, glibc 2.17
        if: always() && runner.os == 'Linux'
        run: |
          set -ex
          docker run --rm --network host -v "$PWD:/w" -w /w -e HAXE_STD_PATH=/w/t/hxmc-haxe-${{ matrix.pkg }}/std centos:7 \
            sh -c 'ldd --version | head -1 && t/hxmc-haxe-${{ matrix.pkg }}/haxe -cp hxmc/test -cp haxe/test --run Check corpus-glibc'
      - name: Port self-compile
        if: always()
        run: |
          set -ex
          root="$SELF_ROOT"
          exe="${{ steps.unpack.outputs.bin }}"
          if [ "$RUNNER_OS" = Linux ]; then sudo mkdir -p "$root" && sudo chown "$USER" "$root"; fi
          if [ "$RUNNER_OS" = Windows ]; then root="$(cygpath -w "$RUNNER_TEMP")\\hih"; fi
          if [ "$RUNNER_OS" = Windows ]; then exe="$(cygpath -m "$exe")"; fi
          export HAXE_STD_PATH="${{ steps.unpack.outputs.std }}"
          # (MSYS would rewrite the reference's root, a POSIX path)
          MSYS_NO_PATHCONV=1 "$exe" -cp hxmc/test -cp haxe/test --run Selfcheck --port "$exe" --src std-x/src --std std-x/std --ref dl/self-ref.hxb --ref-root "$SELF_ROOT" --root "$root" --summary "$GITHUB_STEP_SUMMARY"

      # The native compiler with Mir macros and --run (cross-built by the
      # corpus job) on this machine (docs/hxmc.md, "Macros on the Mir
      # interpreter"), in mir/ (the corpus job's files, Unix line ends): the
      # corpus run in it (as make mir-run-check), the macro cases with Mir
      # macros against the reference (as make mir-macros-check), the compiled
      # functions kept across builds (as make mir-cache-check), statics in the
      # compilation server (as make mir-server-check), and a macro
      # of the benchmarks and the formatter's build against Eval (the release
      # binary; MirBench). Windows: the harnesses run one process at a time
      # (Harness.exec changes the process's working directory there).
      - name: Reference compiler revision
        id: ref
        run: echo "rev=$(git rev-parse --short=7 HEAD:haxe/upstream)" >> "$GITHUB_OUTPUT"
      - name: Cache the reference compiler
        uses: actions/cache@v6
        with:
          path: ref
          key: reference-nightly-${{ matrix.target }}-${{ steps.ref.outputs.rev }}
      - name: Mir lane, setup
        id: mir
        run: |
          set -ex
          mkdir -p mir
          tar xzf dl/mir-data.tar.gz -C mir
          mkdir -p mir/bin/haxe && tar xzf dl/haxe-${{ matrix.target }}.tar.gz -C mir/bin/haxe
          exe=; lix=lix/lix-${{ matrix.target }}
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; lix=$lix.exe; fi
          rev=${{ steps.ref.outputs.rev }}
          native() { if [ "$RUNNER_OS" = Windows ]; then cygpath -m "$1"; else echo "$1"; fi; }
          if [ "${{ matrix.target }}" = windows-arm64 ]; then
            # Haxe has no Windows ARM64 build (nor lix a platform there): the
            # x86-64 nightly, emulated, from the nightlies' listing
            ref="$PWD/ref/nightly/haxe.exe"
            if [ ! -f "$ref" ]; then
              base=https://build.haxe.org/builds/haxe/windows64
              f=$(curl -fsSL --retry 3 "$base/" | grep -o "haxe_[0-9-]*_[a-z_]*_$rev\.zip" | head -1)
              mkdir -p ref/x
              curl -fsSL --retry 3 -o ref/nightly.zip "$base/$f"
              unzip -q ref/nightly.zip -d ref/x
              mv "$(dirname "$(ls ref/x/*/haxe.exe | head -1)")" ref/nightly
            fi
          else
            ref="$PWD/ref/lix/versions/$rev/haxe$exe"
            if [ ! -f "$ref" ]; then
              chmod +x "$lix"; lixp="$PWD/$lix"
              mkdir -p ref
              (cd ref && HAXESHIM_ROOT="$(native "$PWD/lix")" "$lixp" download haxe $rev)
            fi
          fi
          ls -l "$(dirname "$ref")"
          "$ref" -version
          {
            echo "MIR_HAXE=$(native "$PWD/mir/bin/haxe/haxe$exe")"
            echo "MIR_REF=$(native "$ref")"
            echo "MIR_EVAL=$(native "${{ steps.unpack.outputs.bin }}")"
            echo "HXMC_STD=$(native "$PWD/mir/bin/hxmc/std")"
            echo "HAXE_STD_PATH=$(native "$PWD/mir/haxe/upstream/std")"
            echo "MIR_JOBS=$([ "$RUNNER_OS" = Windows ] && echo 1 || echo 4)"
          } >> "$GITHUB_ENV"
          "$PWD/mir/bin/haxe/haxe$exe" -version
      - name: Mir lane, the corpus run in the compiler
        if: always() && steps.mir.outcome == 'success'
        timeout-minutes: 30
        working-directory: mir
        # (Linux: no core dumps. NullAccessCrash ends the compiler with
        # SIGSEGV; the runners pipe cores to systemd-coredump, which ignores
        # the core limit, and the compiler's dump outlasted the case's timeout)
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo sysctl -q -w kernel.core_pattern=core; fi
          ulimit -c 0 2>/dev/null || true
          HXMC_HAXE="$MIR_HAXE" "$MIR_EVAL" -cp hxmc/test -cp haxe/test --run Corpus --mir-run -v -j $MIR_JOBS
      - name: Mir lane, the macro cases with Mir macros
        if: always() && steps.mir.outcome == 'success'
        timeout-minutes: 30
        working-directory: mir
        # (Issue11631: Eval's own mbedtls package, as make mir-macros-check's MIR_MACROS_KNOWN)
        run: |
          HAXE_REFERENCE="$MIR_REF" HAXE_IN_HAXE_PORT="$MIR_HAXE -D hxmc.macros=mir" "$MIR_EVAL" -cp hxmc/test -cp haxe/test --run Conformance -j $MIR_JOBS \
            --cases haxe/test/conformance-macro-cases.txt --target-only --parallel 1 --known eval-Issue11631-compile --summary "$GITHUB_STEP_SUMMARY"
      - name: Mir lane, the compiled functions kept across builds
        if: always() && steps.mir.outcome == 'success'
        timeout-minutes: 15
        working-directory: mir
        run: |
          HXMC_HAXE="$MIR_HAXE" "$MIR_EVAL" -cp hxmc/test -cp haxe/test --run MirCacheCheck
      - name: Mir lane, statics in the compilation server
        # (not on Windows: the servers run through /bin/sh, Server.startServer)
        if: always() && steps.mir.outcome == 'success' && runner.os != 'Windows'
        timeout-minutes: 10
        working-directory: mir
        run: |
          HXMC_HAXE="$MIR_HAXE" HAXE_REFERENCE="$MIR_REF" "$MIR_EVAL" -cp hxmc/test -cp haxe/test --run MirServerCheck
      - name: Mir lane, a benchmark macro and the formatter's build
        if: always() && steps.mir.outcome == 'success'
        timeout-minutes: 20
        working-directory: mir
        run: |
          "$MIR_EVAL" -cp hxmc/test -cp haxe/test --run MirBench --dir bench --mir "$MIR_HAXE -D hxmc.macros=mir" --eval "$MIR_EVAL" --summary "$GITHUB_STEP_SUMMARY"

  # the WebAssembly corpus under node 22 and wasmtime, the port as a module
  # compiling itself under both
  wasm:
    needs: [changes, build, corpus]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.corpus.result == 'success' && needs.changes.outputs.all == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            hxmc/test
            haxe/test
            hxmc/bootstrap
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: wasmtime
        run: |
          set -ex
          curl -sSfL "https://github.com/bytecodealliance/wasmtime/releases/download/v$WASMTIME_VERSION/wasmtime-v$WASMTIME_VERSION-x86_64-linux.tar.xz" | tar xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasmtime-v$WASMTIME_VERSION-x86_64-linux" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v8
        with: {name: corpus-wasm, path: dl}
      - uses: actions/download-artifact@v8
        with: {name: hxmc-self, path: dl}
      - uses: actions/download-artifact@v8
        with: {name: hxmc-haxe-linux-x86_64, path: dl}
      - name: Unpack
        run: |
          set -ex
          mkdir -p corpus corpus-legacy port std-x
          tar xzf dl/corpus-wasm32-wasi.tar.gz -C corpus
          tar xzf dl/corpus-wasm32-wasi-legacy.tar.gz -C corpus-legacy
          tar xzf dl/corpus-wasm32-wasi-port.tar.gz -C port
          tar xzf dl/std.tar.gz -C std-x
          tar xzf dl/src.tar.gz -C std-x
          tar xzf dl/hxmc-haxe-linux-x86_64.tar.gz -C dl
          echo "H=$PWD/dl/hxmc-haxe-linux-x86_64/haxe" >> "$GITHUB_ENV"
          echo "HAXE_STD_PATH=$PWD/dl/hxmc-haxe-linux-x86_64/std" >> "$GITHUB_ENV"
          echo "NODE_WASI=node --no-warnings --stack-size=8000 $PWD/hxmc/bootstrap/wasi.mjs" >> "$GITHUB_ENV"
          sudo mkdir -p "$SELF_ROOT" && sudo chown "$USER" "$SELF_ROOT"
      - name: Corpus under node
        if: always()
        run: $H -cp hxmc/test -cp haxe/test --run Check corpus --runner "$NODE_WASI" --summary "$GITHUB_STEP_SUMMARY"
      - name: Corpus under node, RT_VERIFY=1
        if: always()
        run: RT_VERIFY=1 $H -cp hxmc/test -cp haxe/test --run Check corpus --runner "$NODE_WASI" --summary "$GITHUB_STEP_SUMMARY"
      # built with -D hxmc.wasm-eh=legacy (try/catch_all/rethrow, for engines
      # without exnref), under node without exnref
      - name: Corpus under node, legacy exception handling
        if: always()
        run: $H -cp hxmc/test -cp haxe/test --run Check corpus-legacy --runner "env HXMC_WASM_EXNREF=0 $NODE_WASI" --summary "$GITHUB_STEP_SUMMARY"
      - name: Corpus under wasmtime
        if: always()
        run: $H -cp hxmc/test -cp haxe/test --run Check corpus --runner "wasmtime run -W exceptions=y --dir . --dir / --env RT_MINOR_KB" --summary "$GITHUB_STEP_SUMMARY"
      - name: Corpus under wasmtime, 16 KB nursery
        if: always()
        run: RT_MINOR_KB=16 $H -cp hxmc/test -cp haxe/test --run Check corpus --runner "wasmtime run -W exceptions=y --dir . --dir / --env RT_MINOR_KB" --summary "$GITHUB_STEP_SUMMARY"
      - name: Port self-compile under node
        if: always()
        run: $H -cp hxmc/test -cp haxe/test --run Selfcheck --runner "$NODE_WASI" --port port/haxe.wasm --src std-x/src --std std-x/std --ref dl/self-ref.hxb --ref-root "$SELF_ROOT" --root "$SELF_ROOT" --summary "$GITHUB_STEP_SUMMARY"
      - name: Port self-compile under node, legacy exception handling
        if: always()
        run: $H -cp hxmc/test -cp haxe/test --run Selfcheck --runner "env HXMC_WASM_EXNREF=0 $NODE_WASI" --port port/haxe-legacy.wasm --src std-x/src --std std-x/std --ref dl/self-ref.hxb --ref-root "$SELF_ROOT" --root "$SELF_ROOT" --summary "$GITHUB_STEP_SUMMARY"
      - name: Port self-compile under wasmtime
        if: always()
        run: $H -cp hxmc/test -cp haxe/test --run Selfcheck --runner "wasmtime run -W exceptions=y -W max-wasm-stack=67108864 --dir / --env HAXE_STD_PATH --env PWD" --port port/haxe.wasm --src std-x/src --std std-x/std --ref dl/self-ref.hxb --ref-root "$SELF_ROOT" --root "$SELF_ROOT" --summary "$GITHUB_STEP_SUMMARY"

  # the website in the browsers' engines (make site-check,
  # site/tools/browser-test.mjs): links; every page in Chromium, Firefox
  # and WebKit, at a desktop's and a phone's width (no errors, no horizontal
  # scrolling); the playground's worker (--interp, HXB, diagnostics,
  # completion) with both modules, the page's choice of module, also in a
  # Chromium without exnref; the benchmark tables
  playground:
    needs: [changes, site]
    if: ${{ !cancelled() && needs.site.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            site/tools
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with: {name: site, path: site-dist}
      - name: The website in Chromium, Firefox and WebKit
        timeout-minutes: 20
        run: |
          set -ex
          npm install --no-save --silent playwright@1.56.1
          # --with-deps runs apt-get, which at times stalled on a mirror with
          # no output: apt's own timeouts and retries end a stalled request,
          # and a try waits for the dpkg lock an earlier one still holds
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nDPkg::Lock::Timeout "300";\n' | sudo tee /etc/apt/apt.conf.d/99ci-timeouts > /dev/null
          retry() { for n in 1 2 3; do "$@" && return 0; echo "retry: $* failed (try $n)"; sleep 10; done; return 1; }
          # in two parts, so a log shows which one stalls: the system
          # packages (apt, under the timeouts above), then the browsers'
          # downloads, which stalled with no output too: each try of those
          # ends after 5 minutes (it needs well under 1) and the next starts
          retry npx playwright install-deps chromium firefox webkit > /dev/null
          retry timeout -k 10 300 npx playwright install chromium firefox webkit > /dev/null
          node site/tools/browser-test.mjs site-dist chromium firefox webkit

  # the npm packages in fresh projects, on each target's machine (every
  # package installed before publish-npm publishes them): @hxmc/cli with its
  # platform package (native at once, node_modules/.bin/haxe the native
  # compiler on Unix; -lib from lix's scopes, node_modules and haxelib; with --ignore-scripts after the
  # first call) on all six every run; on linux-x64 a cross build (another
  # machine's platform package, --force); and on linux-x64 (on all six on
  # main, tags and nightly: changes.outputs.npm_full) lix with dist/
  # (build: lix)
  npm:
    needs: [changes, npm-pack, build]
    if: ${{ !cancelled() && needs.npm-pack.result == 'success' && needs.build.result == 'success' && needs.changes.outputs.all == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, plat: linux-x64, lix: linux-x86_64, full: true}
          - {os: ubuntu-24.04-arm, plat: linux-arm64}
          - {os: macos-15, plat: darwin-arm64, lix: macos-arm64}
          - {os: macos-15-intel, plat: darwin-x64}
          - {os: windows-2025, plat: win32-x64}
          - {os: windows-11-arm, plat: win32-arm64}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      HXMC_CACHE: ${{ github.workspace }}/hxmc-cache
      FULL: ${{ matrix.full || needs.changes.outputs.npm_full == 'true' }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with: {name: npm, path: dl}
      - uses: actions/download-artifact@v8
        if: matrix.lix && env.FULL == 'true'
        with: {name: lix, path: dl/lix}
      # (from the tarballs alone: the other platform packages, optional, are
      # found nowhere)
      - name: Install @hxmc/cli and its platform package
        run: |
          set -ex
          v=$(cat dl/VERSION)
          mkdir -p "$RUNNER_TEMP/app/src" && cd "$RUNNER_TEMP/app"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/dl/hxmc-cli-$v.tgz" "$GITHUB_WORKSPACE/dl/hxmc-${{ matrix.plat }}-$v.tgz"
          printf 'class Main { static function main() { Sys.println("hello from " + Sys.systemName()); } }\n' > src/Main.hx
          printf 'class Js { static function main() { trace("hello from js"); } }\n' > src/Js.hx
          printf -- '-cp src\n-main Main\n--custom-target hxmc=bin/app\n' > build.hxml
          # (no compiler sources, no runtime objects in @hxmc/cli: they are the platform package's)
          test ! -e node_modules/@hxmc/cli/haxe/src && test ! -e node_modules/@hxmc/cli/hxmc/bootstrap/rt
          test -d node_modules/@hxmc/cli/hxmc/bootstrap/hxmc-std
          ls node_modules/@hxmc/${{ matrix.plat }}/*/rt.o
          # Unix: the postinstall put the native compiler where npm's link points
          if [ "$RUNNER_OS" != Windows ]; then head -c 4 node_modules/.bin/haxe | od -An -tx1 | tee magic.txt; ! grep -q "23 21" magic.txt; fi
      - name: Native at once
        run: |
          set -ex
          cd "$RUNNER_TEMP/app"
          npx haxe --version > version.out 2> version.err
          cat version.out
          test ! -s version.err
          npx hxmc --version
          npx haxe -cp src -main Main --interp | tee out.txt
          grep -q "hello from" out.txt
          time npx haxe build.hxml
          if [ "$RUNNER_OS" = Windows ]; then ./bin/app.exe; ls -l node_modules/@hxmc/cli/dist/haxe.exe; else ./bin/app; fi
          npx haxe -cp src -main Js --js main.js && node main.js | tee js.out
          grep -q "hello from js" js.out
          # Windows: the native compiler run without node passes a build for hxmc to the launcher
          if [ "$RUNNER_OS" = Windows ]; then rm -rf bin && node_modules/@hxmc/cli/dist/haxe.exe build.hxml && ./bin/app.exe; fi
      # -lib: lix's scopes, node_modules, haxelib (hxmc/test/Libraries.hx), by the
      # native compiler run without node (npm's link to it on Unix, dist/haxe.exe on Windows)
      - name: -lib from lix's scopes, node_modules, haxelib
        run: |
          set -ex
          cd "$RUNNER_TEMP/app"
          if [ "$RUNNER_OS" = Windows ]; then hx="$PWD/node_modules/@hxmc/cli/dist/haxe.exe"; else hx="$PWD/node_modules/.bin/haxe"; fi
          "$hx" -cp "$GITHUB_WORKSPACE/dl" --run Libraries --haxe "$hx" --dir "$RUNNER_TEMP/libraries"
      # a compilation server (`haxe --wait`) from the native compiler run without
      # node: its builds for hxmc find the platform package's runtime objects
      - name: A compilation server
        run: |
          set -ex
          cd "$RUNNER_TEMP/app"
          if [ "$RUNNER_OS" = Windows ]; then hx="$PWD/node_modules/@hxmc/cli/dist/haxe.exe"; app=bin/app.exe; else hx="$PWD/node_modules/.bin/haxe"; app=bin/app; fi
          "$hx" --wait 6301 > server.log 2>&1 &
          srv=$!
          trap 'kill $srv 2>/dev/null || true' EXIT
          for i in $(seq 1 150); do if "$hx" --connect 6301 --version > /dev/null 2>&1; then break; fi; sleep 0.2; done
          rm -rf bin
          "$hx" --connect 6301 build.hxml || { cat server.log; exit 1; }
          ./$app
          # (a client that connects and closes without a request, a probe, does not end it)
          node -e "const s = require('net').connect(6301, '127.0.0.1', () => s.end())"
          sleep 0.5
          rm -rf bin
          "$hx" --connect 6301 -cp src -main Main --custom-target hxmc=bin/app
          ./$app
      - name: With --ignore-scripts, the first call installs the native compiler
        if: runner.os != 'Windows'
        run: |
          set -ex
          v=$(cat dl/VERSION)
          mkdir -p "$RUNNER_TEMP/noscripts" && cd "$RUNNER_TEMP/noscripts"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund "$GITHUB_WORKSPACE/dl/hxmc-cli-$v.tgz" "$GITHUB_WORKSPACE/dl/hxmc-${{ matrix.plat }}-$v.tgz"
          head -c 2 node_modules/.bin/haxe | grep -q '#!'
          npx haxe --version
          head -c 4 node_modules/.bin/haxe | od -An -tx1 | tee magic.txt; ! grep -q "23 21" magic.txt
      # cross builds (docs/using.md): without another machine's platform
      # package a build for it says which to install; with it (--force: its
      # os and cpu are not this machine's) its runtime objects are used
      - name: Cross build
        if: matrix.plat == 'linux-x64'
        run: |
          set -ex
          v=$(cat dl/VERSION)
          cd "$RUNNER_TEMP/app"
          if npx haxe -cp src -main Main --custom-target hxmc=bin/cross -D hxmc.target=windows-x86_64 2> cross.err; then exit 1; fi
          cat cross.err; grep -q "@hxmc/win32-x64" cross.err; test ! -e bin/cross.exe
          # (and so for the native compiler run without node)
          if node_modules/.bin/haxe -cp src -main Main --custom-target hxmc=bin/cross -D hxmc.target=windows-x86_64 2> cross2.err; then exit 1; fi
          grep -q "@hxmc/win32-x64" cross2.err
          npm install --force --no-audit --no-fund "$GITHUB_WORKSPACE/dl/hxmc-win32-x64-$v.tgz"
          npx haxe -cp src -main Main --custom-target hxmc=bin/cross -D hxmc.target=windows-x86_64
          test -s bin/cross.exe
          # (the native compiler of this machine still runs)
          npx haxe build.hxml && ./bin/app
          # Android: in no package
          if npx haxe -cp src -main Main --custom-target hxmc=bin/app.so -D hxmc.target=android-arm64 2> android.err; then exit 1; fi
          cat android.err; grep -q "release archive" android.err
      # lix with the package's installation (dist/) as its Haxe
      - name: lix
        if: matrix.lix && env.FULL == 'true'
        run: |
          set -ex
          cd "$RUNNER_TEMP/app"
          export HAXESHIM_ROOT="$RUNNER_TEMP/lix-root"
          mkdir -p "$RUNNER_TEMP/lix" && cp "$GITHUB_WORKSPACE/dl/lix/lix-${{ matrix.lix }}" "$RUNNER_TEMP/lix/lix" && chmod +x "$RUNNER_TEMP/lix/lix"
          export PATH="$RUNNER_TEMP/lix:$PATH"
          lix shims
          lix scope create
          lix use haxe ./node_modules/@hxmc/cli/dist
          cat .haxerc
          haxe --version
          printf -- '-cp src\n-main Main\n--custom-target hxmc=bin/applix\n' > lix.hxml
          haxe lix.hxml
          ./bin/applix

  # upstream Haxe's compiler-side suite (RunCi macro) with the release
  # binaries as haxe (upstream-tests.yml)
  upstream-tests:
    needs: [changes, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.changes.outputs.all == 'true' }}
    uses: ./.github/workflows/upstream-tests.yml

  # npm: the seven packages at one version (npm-pack's), installed and
  # tested by the npm job: the six platform packages, then @hxmc/cli: on v*
  # tags (dist-tag latest) and pushes to main (a nightly, dist-tag next);
  # never from other branches.
  # After every check (the full npm set on all six machines: npm_full).
  publish-npm:
    needs: [changes, build, corpus, crosshost, npm-pack, site, conformance, fuzz-exec, upstream-suites, test, wasm, playground, npm]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.build.result == 'success' && needs.corpus.result == 'success' && needs.crosshost.result == 'success' && needs.npm-pack.result == 'success' && needs.site.result == 'success' && needs.conformance.result == 'success' && needs.fuzz-exec.result == 'success' && needs.upstream-suites.result == 'success' && needs.test.result == 'success' && needs.wasm.result == 'success' && needs.playground.result == 'success' && needs.npm.result == 'success' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      # (npm's trusted publishing, OIDC through id-token: npm 11.5.1 or
      # later, which node 24 ships; each package is registered on npm for
      # this repository and build.yml, without an environment)
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with: {name: npm, path: dl}
      - name: Publish
        run: |
          set -ex
          v=$(cat dl/VERSION)
          tag=latest
          case "$GITHUB_REF" in refs/heads/main) tag=next ;; esac
          # a tarball's path starts with ./ (npm reads dl/x.tgz as a GitHub
          # user/repo); versions already published are skipped, so a run that
          # stopped halfway can be run again
          publish() {
            if npm view "$1@$v" version >/dev/null 2>&1; then echo "$1@$v is published already"; return; fi
            npm publish --access public --provenance --tag $tag "$2"
          }
          # (the seven at this version, each one's dependencies first:
          # @hxmc/cli last, whose optional dependencies must exist)
          pkgs="linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64 cli"
          # (exactly these tarballs, each at this version and named for its package)
          test "$(ls dl/*.tgz | wc -l)" -eq 7
          for p in $pkgs; do
            test "$(tar xzf "dl/hxmc-$p-$v.tgz" -O package/package.json | node -p 'const m = JSON.parse(require("fs").readFileSync(0)); m.name + "@" + m.version')" = "@hxmc/$p@$v"
          done
          # (@hxmc/cli's optional dependencies: the six, at this version)
          tar xzf "dl/hxmc-cli-$v.tgz" -O package/package.json | node -e 'const m = JSON.parse(require("fs").readFileSync(0)); const d = m.optionalDependencies; if (Object.keys(d).sort().join() !== process.argv[2].split(" ").filter(p => p !== "cli").map(p => "@hxmc/" + p).sort().join()) throw new Error(Object.keys(d).join()); for (const [k, x] of Object.entries(d)) if (x !== process.argv[1]) throw new Error(k + "@" + x)' "$v" "$pkgs"
          for p in $pkgs; do
            publish "@hxmc/$p" "./dl/hxmc-$p-$v.tgz"
          done

  # nightly on main, a release on v* tags
  release:
    needs: [changes, build, corpus, crosshost, npm-pack, site, conformance, fuzz-exec, upstream-suites, test, wasm, playground, npm]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.build.result == 'success' && needs.corpus.result == 'success' && needs.crosshost.result == 'success' && needs.npm-pack.result == 'success' && needs.site.result == 'success' && needs.conformance.result == 'success' && needs.fuzz-exec.result == 'success' && needs.upstream-suites.result == 'success' && needs.test.result == 'success' && needs.wasm.result == 'success' && needs.playground.result == 'success' && needs.npm.result == 'success' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: hxmc-haxe-*
          path: assets
          merge-multiple: true
      - name: The npm package
        uses: actions/download-artifact@v8
        with: {name: npm, path: npm}
      - name: Publish
        run: |
          set -ex
          cp npm/hxmc-cli-$(cat npm/VERSION).tgz assets/
          ls -l assets
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-9)
          NOTES="Built from $GITHUB_SHA by hxmc (the port compiled to machine code for each target, cross-built on Linux, with mbedtls and libuv).

          - hxmc-haxe-<os>-<arch>.tar.gz: Linux and macOS, haxe with std/; set HAXE_STD_PATH to it.
          - hxmc-haxe-windows-<arch>.zip: Windows, haxe.exe with std/; set HAXE_STD_PATH to it.
          - hxmc-cli-<version>.tgz: the npm package @hxmc/cli (its platform packages, @hxmc/wasm and @hxmc/source are on npm).

          Each archive carries the licenses: LICENSE and COPYING (the port), LICENSE.mbedtls and LICENSE.libuv."
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG=$GITHUB_REF_NAME
            gh release create "$TAG" --verify-tag --title "hxmc $TAG" --notes "$NOTES" assets/*
          else
            TAG=nightly
            if gh release view "$TAG" > /dev/null 2>&1; then
              # move the tag, then replace the assets in place (the download URLs stay valid)
              gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true
              gh release upload "$TAG" assets/* --clobber
              gh release edit "$TAG" --prerelease --title "Nightly ($SHORT)" --notes "$NOTES"
            else
              gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "Nightly ($SHORT)" --notes "$NOTES" assets/*
            fi
          fi

  pages:
    needs: [changes, build, corpus, crosshost, npm-pack, site, wasm, playground]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.build.result == 'success' && needs.corpus.result == 'success' && needs.crosshost.result == 'success' && needs.npm-pack.result == 'success' && needs.site.result == 'success' && needs.wasm.result == 'success' && needs.playground.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
