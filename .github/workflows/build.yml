# Builds everything from source with node and hxmc (docs/development.md, "Building")
# and tests it on a machine of each target (docs/testing.md, "CI"):
#
# - changes: what the run needs (.github/select.sh): everything, except on a
#   branch whose changes since the last checked commit are only docs (*.md:
#   the site, which renders them), site/ (site, playground) or source-only
#   packages of packages/ (build, gfx, npm-pack, the site); main, tags, the nightly schedule and
#   dispatches always run everything. Also whether the release
#   rt-<hash of hxmc/deps> exists (hxmc/bootstrap/rt.mjs).
# - rt-build, rt: only when that release is missing: the runtime objects of
#   the six targets, Linux's glibc mode and Android (hxmc/deps with mbedtls and libuv,
#   built by zig), one job per target, then assembled, their layouts checked,
#   published as the release from pushes to main and hxmc and passed on as an
#   artifact (the jobs below otherwise download the release: make rt).
# - build: the committed stage0 module under node builds the tool, which
#   rebuilds itself (the fixpoint: with the module cache cold, warm and off),
#   the module cache's store and gate are checked; then the port's release
#   binaries and lix for the six targets.
#   Next to it, each with its own tool from the stage0 (make hxmc):
#   - corpus: hxmc's corpus for every target (in three jobs), the port as a
#     WebAssembly module, the reference's self-compile (lix downloads the
#     reference compiler, the nightly of the pinned upstream commit, cached);
#   - crosshost (two jobs): the tool as a WebAssembly module building the
#     corpus and itself byte-identical;
#   - measure: peak memory and times (haxe/test/Measure.hx) in the job summary;
#   - npm-pack: the npm packages (with the compiler as a WebAssembly module;
#     built with the module cache off);
#   - site: the website (site/: its pages, the examples built for the browser,
#     the API read by the compiler, the playground's compiler); gfx: packages/gfx on Linux (make gfx-check; on
#     ARM64 the cross-built programs, gfx-arm64; on Windows x86-64 and arm64
#     the cross-built programs on D3D11's WARP, gfx-windows; on macOS built
#     from the npm packages after npm-pack, gfx-macos), packages/os's audio
#     in the same jobs (make audio-check, audio-web-check) and its touch
#     gesture (touch-check, gfx's job), then
#     packages/view, web, text, ui and theme (their checks on Eval, the sample UI and the
#     todo example drawn on llvmpipe, the todo example in Chromium on WebGPU
#     and WebGL2, web's demo page hydrated in Chromium).
#   - android: the APKs for android-arm64 and android-x86_64 checked, then
#     AndroidTest, AndroidNativeTest (views, real input, accessibility),
#     AndroidMixTest (a GPU view among views), AndroidTextTest (the input
#     method in a drawn window) and AndroidTouchTest (a fling in a drawn
#     scroll box) on an x86-64 emulator (not required yet:
#     continue-on-error).
#   - ios: the app bundles for ios-arm64 and ios-sim-arm64 checked, then
#     (ios-simulator, on a macOS runner) IosTest on an iPhone simulator (not
#     required yet: continue-on-error).
# - conformance: the port against the reference: HXB of the upstream suites
#   and macro cases, display requests, the compilation server and its
#   JSON-RPC methods, upstream's target suites compiled by both and compared
#   file by file, the Eval debugger and the fuzzer's lanes, the last two in
#   shards (haxe/test).
# - fuzz-exec: the fuzzer's exec lanes, one job each (with its own tool from
#   the stage0): random programs run by the reference's Eval and built by
#   hxmc (native, wasm32-wasi), their output compared.
# - test: on each target's machine, the release binary's smoke test (with a
#   TLS handshake and libuv), lix, hxmc's corpus and the port's self-compile.
# - wasm: the corpus and the port's self-compile under node and wasmtime;
#   playground: the website in Chromium, Firefox and WebKit (make site-check).
# - npm: the nine packages (@hxmc/cli, its six platform packages, @hxmc/wasm,
#   @hxmc/source) installed in fresh projects on each target's machine: native
#   at once, -lib from node_modules, --ignore-scripts; and on linux-x64 (on
#   all six on main, tags and nightly, before publish-npm) lix, the
#   WebAssembly fallback (downloaded, installed) and hxmc-rebuild;
#   publish-npm publishes them on v* tags and (as nightlies) from main.
# - upstream-tests: upstream's compiler-side suite (RunCi macro) with the
#   release binaries as haxe (upstream-tests.yml).
# - release: a rolling `nightly` pre-release on pushes to main, a release on
#   v* tags; pages: the website on pushes to main (with the benchmark history
#   of the bench-data branch, which bench.yml writes).
# Each job names in `needs` only what it uses; publish-npm, release and pages
# wait for every check. The jobs' `if` test each direct need by name (a job
# skipped by `changes`, or rt when the release exists, would otherwise skip
# everything after it; and at job level needs.*.result also holds such a
# skipped job further up).
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  # nightly: everything, the npm packages on all six machines (publishes nothing)
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# a newer push to a branch cancels its run; main (which publishes), hxmc
# (which publishes the runtime objects), tags and the nightly run to the end
concurrency:
  group: build-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/hxmc' && !startsWith(github.ref, 'refs/tags/') }}

env:
  WASMTIME_VERSION: 38.0.1
  # the directory the port's self-compile runs in, on Linux (the reference)
  # and on macOS: the archive names files by absolute path
  SELF_ROOT: /Users/runner/hih
  TARGETS: linux-x86_64 linux-arm64 windows-x86_64 windows-arm64 macos-x86_64 macos-arm64

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      all: ${{ steps.select.outputs.all }}
      libs: ${{ steps.select.outputs.libs }}
      web: ${{ steps.select.outputs.web }}
      # anything that builds (and needs the runtime objects)
      build: ${{ steps.select.outputs.all == 'true' || steps.select.outputs.libs == 'true' || steps.select.outputs.web == 'true' }}
      # the npm job's full set on all six machines
      npm_full: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
      rt_hit: ${{ steps.rt.outputs.hit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - name: What changed
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          REPO: ${{ github.repository }}
        run: sh .github/select.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: The published runtime objects
        id: rt
        run: |
          set -ex
          echo "hash=$(node hxmc/bootstrap/rt.mjs hash)" >> "$GITHUB_OUTPUT"
          if node hxmc/bootstrap/rt.mjs fetch bin/hxmc/rt; then echo "hit=true" >> "$GITHUB_OUTPUT"; else echo "hit=false" >> "$GITHUB_OUTPUT"; fi

  # the runtime objects of one target (and linux-x86_64's, which the tool
  # that assembles the others links), when rt-<hash> is missing
  rt-build:
    needs: changes
    if: needs.changes.outputs.rt_hit != 'true' && needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x86_64, linux-arm64, windows-x86_64, windows-arm64, macos-x86_64, macos-arm64, linux-x86_64-glibc, linux-arm64-glibc, android-arm64, android-x86_64]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: zig
        run: echo "version=$(cat hxmc/deps/zig-version)" >> "$GITHUB_OUTPUT"
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig.outputs.version }}
      - name: System packages
        run: sudo apt-get install -qqy lld llvm
      - name: Cache mbedtls and libuv
        uses: actions/cache@v6
        with:
          path: bin/hxmc/deps
          key: hxmc-deps-zig-${{ steps.zig.outputs.version }}-${{ hashFiles('hxmc/deps/deps.sh') }}-${{ matrix.target }}
      - name: Build the runtime objects with zig
        run: make rt-target RT_TARGET=${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: rt-${{ matrix.target }}
          path: |
            bin/hxmc/rt/LICENSE.*
            bin/hxmc/rt/${{ matrix.target }}/*.o
            bin/hxmc/deps/${{ matrix.target }}/VERSIONS
            bin/hxmc/deps/${{ matrix.target }}/include
          retention-days: 1

  # the ten targets' objects together: the committed layouts checked
  # against every target's headers, published as rt-<hash> (from main and
  # hxmc), passed on as the artifact rt
  rt:
    needs: [changes, rt-build]
    if: ${{ !cancelled() && needs.rt-build.result != 'skipped' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Every target built
        run: test "${{ needs.rt-build.result }}" = success
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: rt
        run: |
          echo "hash=$(node hxmc/bootstrap/rt.mjs hash)" >> "$GITHUB_OUTPUT"
          echo "zig=$(cat hxmc/deps/zig-version)" >> "$GITHUB_OUTPUT"
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.rt.outputs.zig }}
      - uses: actions/download-artifact@v8
        with:
          pattern: rt-*
          path: bin/hxmc
          merge-multiple: true
      # the tool comes from the stage0 module (with linux-x86_64's object)
      - name: Layouts and HASH
        run: |
          set -ex
          touch bin/hxmc/deps/*/VERSIONS bin/hxmc/rt/*/*.o
          ls -l bin/hxmc/rt/*
          make rt-layouts
      - name: Publish rt-${{ steps.rt.outputs.hash }}
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/hxmc')
        run: |
          set -ex
          node hxmc/bootstrap/rt.mjs pack bin/hxmc/rt dist/rt
          gh release create "rt-${{ steps.rt.outputs.hash }}" --target "$GITHUB_SHA" --prerelease \
            --title "hxmc runtime objects ${{ steps.rt.outputs.hash }}" \
            --notes "hxmc's runtime objects (rt.o, ssl.o, uv.o) for the six targets, the glibc mode of Linux and Android, built by zig ${{ steps.rt.outputs.zig }} from hxmc/deps at $GITHUB_SHA; downloaded by hxmc/bootstrap/rt.mjs." dist/rt/*
      - uses: actions/upload-artifact@v7
        with:
          name: rt
          path: |
            bin/hxmc/rt/HASH
            bin/hxmc/rt/LICENSE.*
            bin/hxmc/rt/*/*.o
          retention-days: 7

  # the tool from the committed stage0 (docs/development.md, "Building"): node runs it
  # to build the first native tool, which builds the tool from source; the
  # tool rebuilt by itself does not change. Then the release binaries and lix.
  build:
    needs: [changes, rt]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.rt.result == 'success' || needs.rt.result == 'skipped') && (needs.changes.outputs.all == 'true' || needs.changes.outputs.libs == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.rt_hit != 'true'
        with: {name: rt, path: bin/hxmc/rt}
      - name: Runtime objects
        run: make rt && touch bin/hxmc/rt/*/*.o && ls -l bin/hxmc/rt/*
      - name: Bootstrap from the stage0
        run: make bootstrap
      # the module cache's store (hxmc/src/hxmc/CacheDir.hx): tool
      # directories, the trim, a cache that cannot be written
      - name: Module cache store
        run: bin/hxmc/hxmc -cp hxmc/test -cp haxe/test --run CacheCheck
      # the persistent module cache: the same outputs with and without it
      # (hxmc/src/hxmc/ModuleCache.hx, hxmc/test/ModuleCacheCheck.hx)
      - name: Module cache
        run: make test-module-cache PORT=1

      - name: The port's release binaries
        run: |
          set -ex
          for t in $TARGETS; do make release TARGET=$t; done
          ls -l bin/release/*
      - name: lix for the six targets
        run: make lix-dist

      - name: Package the release binaries
        run: |
          set -ex
          mkdir -p dist
          for t in $TARGETS; do
            os=${t%-*}
            case $t in *-arm64) arch=aarch64 ;; *) arch=x86_64 ;; esac
            P=hxmc-haxe-$os-$arch
            exe=; [ $os = windows ] && exe=.exe
            mkdir -p "pkg/$P"
            cp bin/release/$t/haxe$exe LICENSE COPYING bin/hxmc/rt/LICENSE.mbedtls bin/hxmc/rt/LICENSE.libuv "pkg/$P/"
            cp -r haxe/upstream/std "pkg/$P/std"
            if [ $os = windows ]; then
              printf '%s\r\n' \
                "haxe: the Haxe compiler ported to Haxe, built by hxmc (https://github.com/$GITHUB_REPOSITORY)." \
                "Commit $GITHUB_SHA, target $t (with mbedtls and libuv)." "" \
                "Use it like haxe.exe, with HAXE_STD_PATH pointing at the std directory next to it:" \
                "  set HAXE_STD_PATH=%CD%\\std" \
                "  haxe.exe -main Main --interp" > "pkg/$P/README.txt"
              (cd pkg && zip -qr -9 "../dist/$P.zip" "$P")
            else
              printf '%s\n' \
                "haxe: the Haxe compiler ported to Haxe, built by hxmc (https://github.com/$GITHUB_REPOSITORY)." \
                "Commit $GITHUB_SHA, target $t (with mbedtls and libuv)." "" \
                "Use it like haxe, with HAXE_STD_PATH pointing at the std directory next to it:" \
                "  export HAXE_STD_PATH=\$PWD/std" \
                "  ./haxe -main Main --interp" \
                "macOS: a browser download is quarantined; xattr -d com.apple.quarantine haxe" > "pkg/$P/README.txt"
              tar czf "dist/$P.tar.gz" -C pkg "$P"
            fi
          done
          ls -l dist

      - uses: actions/upload-artifact@v7
        with: {name: hxmc-haxe-linux-x86_64, path: dist/hxmc-haxe-linux-x86_64.tar.gz, retention-days: 14}
      - uses: actions/upload-artifact@v7
        with: {name: hxmc-haxe-linux-aarch64, path: dist/hxmc-haxe-linux-aarch64.tar.gz, retention-days: 14}
      - uses: actions/upload-artifact@v7
        with: {name: hxmc-haxe-macos-x86_64, path: dist/hxmc-haxe-macos-x86_64.tar.gz, retention-days: 14}
      - uses: actions/upload-artifact@v7
        with: {name: hxmc-haxe-macos-aarch64, path: dist/hxmc-haxe-macos-aarch64.tar.gz, retention-days: 14}
      - uses: actions/upload-artifact@v7
        with: {name: hxmc-haxe-windows-x86_64, path: dist/hxmc-haxe-windows-x86_64.zip, retention-days: 14}
      - uses: actions/upload-artifact@v7
        with: {name: hxmc-haxe-windows-aarch64, path: dist/hxmc-haxe-windows-aarch64.zip, retention-days: 14}
      - uses: actions/upload-artifact@v7
        with: {name: lix, path: bin/lix-dist/, retention-days: 14}

  # hxmc's corpus for every target (make corpus-stage; run by the test and
  # wasm jobs on the targets' machines), in three groups of about the same
  # time; with the WebAssembly ones the port as a WebAssembly module (the wasm
  # job) and the reference's self-compile (the test and wasm jobs compare
  # with it)
  corpus:
    needs: [changes, rt]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.rt.result == 'success' || needs.rt.result == 'skipped') && needs.changes.outputs.all == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: unix, targets: linux-x86_64 linux-arm64 linux-x86_64-glibc linux-arm64-glibc macos-x86_64 macos-arm64}
          - {group: windows, targets: windows-x86_64 windows-arm64}
          - {group: wasm, targets: wasm32-wasi wasm32-wasi-legacy}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # (zig: the C companions of corpus cases, Corpus.nativeInputs)
      - id: zig
        run: echo "version=$(cat hxmc/deps/zig-version)" >> "$GITHUB_OUTPUT"
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig.outputs.version }}
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.rt_hit != 'true'
        with: {name: rt, path: bin/hxmc/rt}
      - name: Runtime objects and the tool
        run: |
          set -ex
          make rt && touch bin/hxmc/rt/*/*.o
          make hxmc
      - name: Cross-build hxmc's corpus
        run: make corpus-stage CORPUS_TARGETS="${{ matrix.targets }}"

      - name: The port as a WebAssembly module
        if: matrix.group == 'wasm'
        run: |
          set -ex
          mkdir -p bin/corpus/port
          HXMC_STATS=1 bin/hxmc/hxmc bin/corpus/port/haxe.wasm -cp haxe/src -main haxe.Main -D disable-parallelism -cp bin/hxmc/std --custom-target hxmc -D hxmc.target=wasm32-wasi | tail -3
          HXMC_STATS=1 bin/hxmc/hxmc bin/corpus/port/haxe-legacy.wasm -cp haxe/src -main haxe.Main -D disable-parallelism -cp bin/hxmc/std --custom-target hxmc -D hxmc.target=wasm32-wasi -D hxmc.wasm-eh=legacy | tail -3
          ls -l bin/corpus/port/haxe.wasm bin/corpus/port/haxe-legacy.wasm
      - name: Reference compiler revision
        if: matrix.group == 'wasm'
        id: ref
        run: echo "rev=$(git rev-parse --short=7 HEAD:haxe/upstream)" >> "$GITHUB_OUTPUT"
      - name: Cache the reference compiler
        if: matrix.group == 'wasm'
        uses: actions/cache@v6
        with:
          path: bin/reference
          key: reference-nightly-${{ steps.ref.outputs.rev }}
      # the reference's self-compile, in the directory the macOS runners use
      - name: Reference self-compile
        if: matrix.group == 'wasm'
        run: |
          set -ex
          make lix
          if [ ! -x bin/reference/haxe ]; then make reference; fi
          bin/reference/haxe -version
          sudo mkdir -p "$SELF_ROOT" && sudo chown "$USER" "$SELF_ROOT"
          cp -r haxe/src "$SELF_ROOT/src"
          cp -r haxe/upstream/std "$SELF_ROOT/std"
          (cd "$SELF_ROOT" && HAXE_STD_PATH=std "$GITHUB_WORKSPACE/bin/reference/haxe" -cp src -main haxe.Main -D disable-parallelism --interp --no-output --hxb self-ref.hxb)
          mkdir -p dist/self
          cp "$SELF_ROOT/self-ref.hxb" dist/self/
          # the sources as compiled here (a Windows checkout would have CRLF
          # line ends, and other positions)
          tar czf dist/self/std.tar.gz -C haxe/upstream std
          tar czf dist/self/src.tar.gz -C haxe src
      - uses: actions/upload-artifact@v7
        if: matrix.group == 'wasm'
        with: {name: hxmc-self, path: dist/self/, retention-days: 3}

      - name: Pack the corpus
        run: |
          set -ex
          mkdir -p dist/corpus
          for t in ${{ matrix.targets }}; do tar czf dist/corpus/corpus-$t.tar.gz -C bin/corpus/$t .; done
          if [ -d bin/corpus/port ]; then tar czf dist/corpus/corpus-wasm32-wasi-port.tar.gz -C bin/corpus/port haxe.wasm haxe-legacy.wasm; fi
          ls -l dist/corpus
      - uses: actions/upload-artifact@v7
        with: {name: 'corpus-${{ matrix.group }}', path: dist/corpus/, retention-days: 3}

  # hxmc's output does not depend on the host: the tool as a WebAssembly
  # module (under node) builds the corpus for every target, and the tool
  # itself, byte-identical to the native tool (make crosshost; the targets in
  # two jobs)
  crosshost:
    needs: [changes, rt]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.rt.result == 'success' || needs.rt.result == 'skipped') && needs.changes.outputs.all == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {args: '--tool --targets linux-x86_64,linux-arm64,linux-x86_64-glibc,linux-arm64-glibc'}
          - {args: '--targets windows-x86_64,windows-arm64,macos-x86_64,macos-arm64,wasm32-wasi'}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: zig
        run: echo "version=$(cat hxmc/deps/zig-version)" >> "$GITHUB_OUTPUT"
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig.outputs.version }}
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.rt_hit != 'true'
        with: {name: rt, path: bin/hxmc/rt}
      - name: Runtime objects and the tool
        run: |
          set -ex
          make rt && touch bin/hxmc/rt/*/*.o
          make hxmc
      - name: hxmc as a WebAssembly module, byte-identical output
        run: make crosshost CROSSHOST_ARGS="${{ matrix.args }}"

  # peak memory and time: the bootstrap from the stage0, the self-compile
  # (ours and the reference), the cold native build of the port, the stage0
  # and the npm package's WebAssembly compiler building native compilers
  # (make measure)
  measure:
    name: memory and time
    needs: [changes, rt]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.rt.result == 'success' || needs.rt.result == 'skipped') && needs.changes.outputs.all == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.rt_hit != 'true'
        with: {name: rt, path: bin/hxmc/rt}
      - name: System packages
        run: sudo apt-get install -qqy time
      - name: Runtime objects
        run: make rt && touch bin/hxmc/rt/*/*.o
      - name: Bootstrap from the stage0 (timed)
        run: |
          set -ex
          s=$(date +%s)
          make bootstrap
          echo "BOOTSTRAP_SECONDS=$(( $(date +%s) - s ))" >> "$GITHUB_ENV"
      - name: Reference compiler revision
        id: ref
        run: echo "rev=$(git rev-parse --short=7 HEAD:haxe/upstream)" >> "$GITHUB_OUTPUT"
      - name: Cache the reference compiler
        uses: actions/cache@v6
        with:
          path: bin/reference
          key: reference-nightly-${{ steps.ref.outputs.rev }}
      - name: Memory and time
        run: |
          set -ex
          {
            echo "### Builds"
            echo ""
            echo "| | |"
            echo "| --- | ---: |"
            echo "| clean bootstrap from the stage0 (stage0 under node, the tool from source, the fixpoint) | ${BOOTSTRAP_SECONDS} s |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          make lix
          if [ ! -x bin/reference/haxe ]; then make reference; fi
          touch bin/reference/haxe
          make measure PORT_BIN=bin/release/linux-x86_64/haxe

  # the npm packages (packages/): @hxmc/cli, its six platform packages,
  # @hxmc/wasm and @hxmc/source, at one version: the tag's (v*), a nightly
  # prerelease on main, packages/cli/package.json's elsewhere; and in
  # bin/npm/packages/ the source-only packages at their own versions
  npm-pack:
    needs: [changes, rt]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.rt.result == 'success' || needs.rt.result == 'skipped') && (needs.changes.outputs.all == 'true' || needs.changes.outputs.libs == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.rt_hit != 'true'
        with: {name: rt, path: bin/hxmc/rt}
      - name: Runtime objects and the tool
        run: |
          set -ex
          make rt && touch bin/hxmc/rt/*/*.o
          make hxmc
      # (with the module cache off: the compilers of the packages typed from
      # source, the path the other jobs' builds no longer take)
      - name: The npm packages
        env:
          HXMC_MODULE_CACHE: '0'
        run: |
          set -ex
          v=$(node -p "require('./packages/cli/package.json').version")
          case "$GITHUB_REF" in
            refs/tags/v*) v=${GITHUB_REF_NAME#v} ;;
            refs/heads/main) v=$v-nightly.$(date -u +%Y%m%d).$(git rev-parse --short=7 HEAD) ;;
          esac
          make npm NPM_VERSION=$v
          echo "$v" > bin/npm/VERSION
          # -lib from node_modules (and the npm job's copy of the test)
          make test-node-libs
          cp hxmc/test/NodeLibs.hx bin/npm/
          # what WebAssembly programs see of the file system (the npm job on Windows)
          bin/hxmc/hxmc bin/npm/probe.wasm -cp hxmc/test -main WasiProbe -cp bin/hxmc/std --custom-target hxmc -D hxmc.target=wasm32-wasi
          cat bin/npm/sizes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with: {name: npm, path: "bin/npm/*.tgz\nbin/npm/packages/*.tgz\nbin/npm/NodeLibs.hx\nbin/npm/probe.wasm\nbin/npm/VERSION\nbin/npm/sizes.md", retention-days: 7}

  # the website (site/, make site): its pages, the examples built for the
  # browser, the API reference, the playground's WebAssembly, the pages'
  # JavaScript, lix under tools/ (the Programs benchmarks: the history on the
  # bench-data branch, bench.yml); its page weights in the job summary
  site:
    needs: [changes, rt]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.rt.result == 'success' || needs.rt.result == 'skipped') && (needs.changes.outputs.all == 'true' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.rt_hit != 'true'
        with: {name: rt, path: bin/hxmc/rt}
      - name: Runtime objects
        run: make rt && touch bin/hxmc/rt/*/*.o
      - name: The website
        # (off main and tags, the modules with their function names: a trap's
        # stack in the browser tests names its frames; the code is the same,
        # the names add about 8% gzipped, so the published site goes without)
        env:
          HXMC_SYMBOLS: ${{ (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')) && '1' || '' }}
        run: |
          set -ex
          [ -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ] || { sudo apt-get update -qq && sudo apt-get install -qqy --no-install-recommends fonts-dejavu-core > /dev/null; }
          make lix-dist
          mkdir -p bin/bench-data
          if git fetch --depth 1 origin bench-data; then git archive FETCH_HEAD | tar -x -C bin/bench-data; fi
          make site LIX_DIR=bin/lix-dist BENCH_DATA=bin/bench-data
          ls -l bin/site bin/site/tools
          { echo '### Page weights'; echo '```'; node site/tools/weights.mjs bin/site; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with: {name: site, path: bin/site/, retention-days: 7}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: bin/site

  # packages/gfx: the shader macro's tests (make gfx-shader-check), then
  # the triangle and the cube headless and in an X11 window, on Mesa's
  # llvmpipe (no GPU), against the golden images (make gfx-check: the test
  # programs in the glibc mode, packages/gfx/test/check.sh), here on Linux
  # x86-64, and on WebGPU and WebGL2 in headless Chromium (make
  # gfx-web-check), and the module cache across a WasmGC and a native build
  # on one store (make gfx-cache-check); the ARM64 and Windows programs cross-built for gfx-arm64
  # and gfx-windows. packages/os's audio alongside: ALSA's null and file
  # devices (make audio-check), WebAudio in headless Chromium (make
  # audio-web-check), the ARM64 and Windows AudioTest cross-built
  gfx:
    needs: [changes, rt]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.rt.result == 'success' || needs.rt.result == 'skipped') && (needs.changes.outputs.all == 'true' || needs.changes.outputs.libs == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.rt_hit != 'true'
        with: {name: rt, path: bin/hxmc/rt}
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qqy --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri libgles2 xvfb xauth libasound2t64 fonts-dejavu-core fonts-inter libgtk-3-0t64 dbus at-spi2-core fonts-noto-color-emoji
      - name: gfx (Mesa llvmpipe, Xvfb)
        run: |
          set -ex
          make rt && touch bin/hxmc/rt/*/*.o
          make gfx-shader-check
          make gfx-check GFX_TARGET=linux-x86_64
      - name: 3d (Eval, natively, wasm32-wasi; Mesa llvmpipe)
        run: |
          set -ex
          make 3d-check GFX_TARGET=linux-x86_64
          make 3d-sizes
      - name: audio (ALSA's null and file devices)
        run: make audio-check AUDIO_TARGET=linux-x86_64
      - name: touch (TouchDrag, the gesture of Android and iOS)
        run: make touch-check
      - name: gfx (WebGPU, WebGL2 in Chromium)
        run: |
          set -ex
          npm install --no-save --silent playwright@1.56.1
          npx playwright install --with-deps chromium > /dev/null
          make gfx-web-check
          make 3d-web-check
          # (the module cache across WasmGC and native builds on one store)
          make gfx-cache-check
      - name: audio (WebAudio in Chromium)
        run: make audio-web-check
      - name: view, web, text, ui and theme (Eval, natively; Mesa llvmpipe; Chromium)
        run: |
          set -ex
          make view-check web-check text-check ui-check theme-check
          make ui-draw-check GFX_TARGET=linux-x86_64
          make theme-fidelity-check GFX_TARGET=linux-x86_64
          make theme-dom-check web-widgets
          make ui-web-check
      - name: The dev loop (hxmc dev in Chromium and natively under Xvfb)
        run: make dev-check
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: ui-images-linux-x86_64, path: "bin/ui/**/*.png", retention-days: 7, if-no-files-found: ignore}
      - name: The ARM64 programs
        run: |
          set -ex
          make gfx-programs ui-programs 3d-programs GFX_TARGET=linux-arm64
          cp bin/3d/linux-arm64/RenderTest bin/gfx/linux-arm64/
          make audio-programs AUDIO_TARGET=linux-arm64
          cp bin/audio/linux-arm64/AudioTest bin/ui/linux-arm64/UiDrawTest bin/ui/linux-arm64/TodoTest bin/ui/linux-arm64/GalleryTest bin/gfx/linux-arm64/
          tar czf bin/gfx-linux-arm64.tar.gz -C bin/gfx/linux-arm64 GfxTest Triangle Cube AudioTest UiDrawTest TodoTest GalleryTest RenderTest
      - uses: actions/upload-artifact@v7
        with: {name: gfx-linux-arm64, path: bin/gfx-linux-arm64.tar.gz, retention-days: 3}
      - name: The Windows programs
        run: |
          set -ex
          for t in windows-x86_64 windows-arm64; do
            make gfx-programs ui-programs 3d-programs GFX_TARGET=$t
            cp bin/3d/$t/RenderTest.exe bin/gfx/$t/
            make audio-programs AUDIO_TARGET=$t
            make devhost-programs GFX_TARGET=$t
            cp bin/audio/$t/AudioTest.exe bin/ui/$t/UiDrawTest.exe bin/ui/$t/ClipboardTest.exe bin/ui/$t/NativeTest.exe bin/ui/$t/WinAccessTest.exe bin/ui/$t/EmojiTest.exe bin/ui/$t/WindowTest.exe bin/gfx/$t/
            tar czf bin/gfx-$t.tar.gz -C bin/gfx/$t GfxTest.exe Triangle.exe Cube.exe AudioTest.exe UiDrawTest.exe ClipboardTest.exe NativeTest.exe WinAccessTest.exe EmojiTest.exe WindowTest.exe RenderTest.exe dev
          done
      - uses: actions/upload-artifact@v7
        with: {name: gfx-windows, path: "bin/gfx-windows-*.tar.gz", retention-days: 3}
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: gfx-images-linux-x86_64, path: "bin/gfx/linux-x86_64/*.png\nbin/gfx/*.png", retention-days: 7}

  gfx-arm64:
    needs: [changes, gfx]
    if: ${{ !cancelled() && needs.gfx.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            packages/gfx/test
            packages/ui/test
            packages/os/test
            packages/3d/test
      - uses: actions/download-artifact@v8
        with: {name: gfx-linux-arm64, path: dl}
      - name: gfx (Mesa llvmpipe, Xvfb)
        run: |
          set -ex
          sudo apt-get update -qq
          sudo apt-get install -qqy --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri libgles2 xvfb xauth libasound2t64 fonts-dejavu-core
          mkdir -p gfx
          tar xzf dl/gfx-linux-arm64.tar.gz -C gfx
          sh packages/gfx/test/check.sh gfx
          export LIBGL_ALWAYS_SOFTWARE=1
          env -u DISPLAY gfx/UiDrawTest packages/ui/test/draw.png gfx/draw.png
          env -u DISPLAY gfx/TodoTest packages/ui/test/todo.png gfx/todo.png
          env -u DISPLAY gfx/GalleryTest packages/ui/test/gallery.png gfx/gallery.png
          # (packages/3d's frames)
          sh packages/3d/test/check.sh gfx
      - name: audio (ALSA's null and file devices)
        run: sh packages/os/test/audio.sh gfx
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: gfx-images-linux-arm64, path: gfx/*.png, retention-days: 7}

  # packages/gfx on Windows: the cross-built programs on D3D11's WARP
  # (HXMC_GFX_SOFTWARE=1, check.sh), offscreen and in a Win32 window; the
  # audio test on WASAPI's default endpoint, skipped when the runner has
  # none (audio.sh)
  # Android (docs/hxmc.md, "Android"): the APKs hxmc writes for android-arm64
  # and android-x86_64, checked without a device (make android-check: zip,
  # manifest, ELF, v2 signature; the SDK's zipalign, aapt and apksigner),
  # then AndroidTest.apk on an x86-64 emulator with KVM (android.sh: the cube
  # headless against cube.png, frames in the window, input (a drag held on
  # the cube, a fling), Home and back, Back; the screenshot and logcat as an
  # artifact; android-touch.sh: a fling in a drawn scroll box; dev-android.mjs:
  # hxmc dev on the Counter, two edits swapped into the same process, the count
  # kept: docs/dev.md, "No reloads"). Not a required check yet
  # (continue-on-error): emulators on hosted runners are slow to boot and
  # sometimes flaky.
  android:
    needs: [changes, rt]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.rt.result == 'success' || needs.rt.result == 'skipped') && (needs.changes.outputs.all == 'true' || needs.changes.outputs.libs == 'true') }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.rt_hit != 'true'
        with: {name: rt, path: bin/hxmc/rt}
      - name: The APKs and their checks
        run: |
          set -ex
          make rt && touch bin/hxmc/rt/*/*.o
          export PATH="$PATH:$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          make android-check ANDROID_TARGET=android-arm64
          make android-check ANDROID_TARGET=android-x86_64
      - name: Shared libraries (glibc mode)
        run: make shared-check
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: The cube and the native views on an emulator (x86-64, API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            sh packages/gfx/test/android.sh bin/android/android-x86_64/AndroidTest.apk bin/android/android-x86_64
            sh packages/ui/test/android-native.sh bin/android/android-x86_64/AndroidNativeTest.apk bin/android/android-x86_64
            sh packages/ui/test/android-mix.sh bin/android/android-x86_64/AndroidMixTest.apk bin/android/android-x86_64/AndroidTextTest.apk bin/android/android-x86_64
            sh packages/os/test/android-touch.sh bin/android/android-x86_64/AndroidTouchTest.apk bin/android/android-x86_64
            ulimit -s unlimited 2>/dev/null || true; DEV_ANDROID_LOG=bin/android/android-x86_64/dev-logcat.txt node packages/os/test/dev/dev-android.mjs bin/hxmc/hxmc bin/dev/android android-x86_64
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android
          path: |
            bin/android/android-x86_64/*.png
            bin/android/android-x86_64/*.txt
            bin/android/android-x86_64/*.xml
            bin/android/*/*.apk
          retention-days: 7
          if-no-files-found: ignore

  # iOS (docs/hxmc.md, "iOS"): the app bundles hxmc writes for ios-sim-arm64
  # and ios-arm64 (and the cube's .ipa), checked without a Mac (make
  # ios-check: Info.plist, Mach-O, the code signature; llvm-objdump), then
  # IosTest.app on an iPhone simulator of a macOS runner (ios-simulator:
  # ios.sh, codesign --verify, the cube headless against cube.png, frames in
  # the window, a tap, Settings and back; the screenshot, stdout and the
  # system log as an artifact). Not required checks yet (continue-on-error),
  # as android.
  ios:
    needs: [changes, rt]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.rt.result == 'success' || needs.rt.result == 'skipped') && (needs.changes.outputs.all == 'true' || needs.changes.outputs.libs == 'true') }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.rt_hit != 'true'
        with: {name: rt, path: bin/hxmc/rt}
      - name: The app bundles and their checks
        run: |
          set -ex
          make rt && touch bin/hxmc/rt/*/*.o
          make ios-check IOS_TARGET=ios-arm64
          make ios-check IOS_TARGET=ios-sim-arm64
          du -sh bin/ios/*/*.app bin/ios/*/*.ipa
          tar czf bin/ios.tar.gz -C bin ios
      - uses: actions/upload-artifact@v7
        with: {name: ios, path: bin/ios.tar.gz, retention-days: 7}

  ios-simulator:
    needs: [changes, ios]
    if: ${{ !cancelled() && needs.ios.result == 'success' }}
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            packages/gfx/test
      - uses: actions/download-artifact@v8
        with: {name: ios, path: dl}
      - name: IosTest on an iPhone simulator
        run: |
          set -ex
          mkdir -p bin && tar xzf dl/ios.tar.gz -C bin
          xcodebuild -version
          sh packages/gfx/test/ios.sh bin/ios/ios-sim-arm64/IosTest.app bin/ios/ios-sim-arm64 bin/ios/SimTap
      - name: hxmc dev's host on an iPhone simulator (two builds swapped into the running app)
        if: ${{ !cancelled() }}
        run: sh packages/gfx/test/ios-dev.sh bin/ios/ios-sim-arm64 bin/ios/ios-sim-arm64
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-simulator
          path: |
            bin/ios/ios-sim-arm64/*.png
            bin/ios/ios-sim-arm64/*.txt
          retention-days: 7
          if-no-files-found: ignore

  gfx-windows:
    needs: [changes, gfx]
    if: ${{ !cancelled() && needs.gfx.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: windows-x86_64, os: windows-2025}
          - {target: windows-arm64, os: windows-11-arm}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            packages/gfx/test
            packages/os/test
            packages/3d/test
      - uses: actions/download-artifact@v8
        with: {name: gfx-windows, path: dl}
      - name: gfx (D3D11 WARP, Win32)
        run: |
          set -ex
          mkdir -p gfx
          tar xzf dl/gfx-${{ matrix.target }}.tar.gz -C gfx
          sh packages/gfx/test/check.sh gfx
          # (the UI's sample with the system's fonts: no golden image)
          HXMC_GFX_SOFTWARE=1 gfx/UiDrawTest.exe none gfx/ui-smoke.png --smoke
          # (the clipboard between two windows: Win32's CF_UNICODETEXT)
          gfx/ClipboardTest.exe
          # (hxmc.ui.native on Win32's controls)
          gfx/NativeTest.exe
          # (the accessibility tree through UI Automation: Narrator's view of it)
          HXMC_GFX_SOFTWARE=1 gfx/WinAccessTest.exe
          # (colour emoji: Segoe UI Emoji's COLR layers)
          HXMC_GFX_SOFTWARE=1 gfx/EmojiTest.exe none gfx/emoji.png
          # (a window's title, size and minimum size, read back)
          gfx/WindowTest.exe
          # (packages/3d's frames on WARP)
          sh packages/3d/test/check.sh gfx
      - name: hxmc dev's host (two builds swapped into the running process, docs/dev.md)
        if: ${{ !cancelled() }}
        run: HXMC_GFX_SOFTWARE=1 sh packages/gfx/test/host-dev.sh gfx/dev dll host.exe
      - name: audio (WASAPI)
        run: sh packages/os/test/audio.sh gfx
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: 'gfx-images-${{ matrix.target }}', path: gfx/*.png, retention-days: 7}

  # packages/gfx on macOS: the examples and their test built from the npm
  # packages (@hxmc/cli with its platform package, -lib hxmc.gfx from
  # node_modules), then run on Metal and in a Cocoa window (check.sh: skipped
  # without a Metal device or outside a GUI session); the audio test from
  # -lib hxmc.os on CoreAudio's generic output unit, then the default output
  # (skipped without one: audio.sh)
  gfx-macos:
    needs: [changes, npm-pack]
    if: ${{ !cancelled() && needs.npm-pack.result == 'success' }}
    runs-on: macos-15
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with: {name: npm, path: dl}
      - uses: actions/checkout@v7
        with:
          path: repo
          sparse-checkout: |
            packages/gfx
            packages/ui
            packages/os/test
      - name: gfx (Metal, Cocoa)
        run: |
          set -ex
          v=$(cat dl/VERSION)
          mkdir -p "$RUNNER_TEMP/app" && cd "$RUNNER_TEMP/app"
          npm init -y > /dev/null
          # (a nightly, <version>-nightly.<date>.<commit>, is a prerelease, which
          # the packages' peer range ">=0.1.0" of @hxmc/cli does not take)
          peer=; case "$v" in *-nightly.*) peer=--legacy-peer-deps ;; esac
          npm install --no-audit --no-fund $peer "$GITHUB_WORKSPACE/dl/hxmc-cli-$v.tgz" "$GITHUB_WORKSPACE/dl/hxmc-darwin-arm64-$v.tgz" $(find "$GITHUB_WORKSPACE/dl" -name 'hxmc-os-*.tgz' -o -name 'hxmc-gfx-*.tgz' -o -name 'hxmc-text-*.tgz' -o -name 'hxmc-view-*.tgz' -o -name 'hxmc-ui-*.tgz')
          g="$GITHUB_WORKSPACE/repo/packages/gfx"
          npx haxe -lib hxmc.gfx -cp "$g/examples" -cp "$g/test" -main GfxTest --custom-target hxmc=gfx/GfxTest
          npx haxe -lib hxmc.gfx -cp "$g/examples" -main Triangle --custom-target hxmc=gfx/Triangle
          npx haxe -lib hxmc.gfx -cp "$g/examples" -main Cube --custom-target hxmc=gfx/Cube
          ls -l gfx/GfxTest gfx/Triangle gfx/Cube
          otool -L gfx/Triangle
          sh "$g/test/check.sh" gfx
          # the UI's sample built from the npm packages, with the system's fonts (no golden image)
          u="$GITHUB_WORKSPACE/repo/packages/ui"
          npx haxe -lib hxmc.ui -cp "$g/test" -cp "$u/test" -main UiDrawTest --custom-target hxmc=gfx/UiDrawTest
          gfx/UiDrawTest none gfx/ui-smoke.png --smoke
          # (the clipboard between two windows: NSPasteboard)
          npx haxe -lib hxmc.os -cp "$u/test" -main ClipboardTest --custom-target hxmc=gfx/ClipboardTest
          gfx/ClipboardTest
          # (text input through the window's text view: a key, a composition)
          npx haxe -lib hxmc.os -cp "$u/test" -main TextInputTest --custom-target hxmc=gfx/TextInputTest
          gfx/TextInputTest
          # (the accessibility tree through NSAccessibility: VoiceOver's view of it)
          npx haxe -lib hxmc.ui -cp "$u/test" -main MacAccessTest --custom-target hxmc=gfx/MacAccessTest
          gfx/MacAccessTest
          # (colour emoji: Apple Color Emoji's sbix bitmaps)
          npx haxe -lib hxmc.ui -cp "$g/test" -cp "$u/test" -main EmojiTest --custom-target hxmc=gfx/EmojiTest
          gfx/EmojiTest none gfx/emoji.png
          # (a window's title, size and minimum size, read back)
          npx haxe -lib hxmc.os -cp "$u/test" -main WindowTest --custom-target hxmc=gfx/WindowTest
          gfx/WindowTest
          # (hxmc.ui.native on AppKit's controls)
          npx haxe -lib hxmc.ui -cp "$u/test" -cp "$u/examples" -main NativeTest --custom-target hxmc=gfx/NativeTest
          gfx/NativeTest gfx/native-macos.png
      - name: hxmc dev's host (two builds swapped into the running process, docs/dev.md)
        if: ${{ !cancelled() }}
        run: |
          set -ex
          cd "$RUNNER_TEMP/app"
          g="$GITHUB_WORKSPACE/repo/packages/gfx"
          npx haxe -lib hxmc.os -main hxmc.dev.DevHost --custom-target hxmc=dev/host
          for v in 1 2 3; do npx haxe -lib hxmc.gfx -cp "$g/examples" -cp "$g/test" -main DevHostTest -D hxmc.dev -D hxmc.dev-host -D hxmc.shared -D hxmc.exports=hxmc_dev_run,hxmc_dev_state -D devhost_version=$v --custom-target hxmc=dev/DevHost$v.dylib; done
          sh "$g/test/host-dev.sh" dev dylib host
      - name: audio (CoreAudio)
        run: |
          set -ex
          cd "$RUNNER_TEMP/app"
          o="$GITHUB_WORKSPACE/repo/packages/os"
          npx haxe -lib hxmc.os -cp "$o/test" -main AudioTest --custom-target hxmc=audio/AudioTest
          otool -L audio/AudioTest
          sh "$o/test/audio.sh" audio
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: gfx-images-macos-arm64, path: "${{ runner.temp }}/app/gfx/*.png", retention-days: 7, if-no-files-found: ignore}

  # the port against the reference compiler (docs/testing.md); the Eval
  # debugger in shards (EvalDebugger --shard), the fuzzer's diff lanes (the
  # targets that need no library) split across three jobs
  conformance:
    needs: [changes, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.changes.outputs.all == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: hxb macro haxelib}
          - {suite: display server jsonrpc}
          - {suite: targets}
          - {suite: debugger, shard: 1/3}
          - {suite: debugger, shard: 2/3}
          - {suite: debugger, shard: 3/3}
          - {suite: fuzz, lanes: 'diff:hxb diff:interp diff:js diff:python'}
          - {suite: fuzz, lanes: 'diff:lua diff:php diff:hlc'}
          - {suite: fuzz, lanes: 'diff:neko diff:hl diff:swf'}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with: {name: hxmc-haxe-linux-x86_64, path: dl}
      - uses: actions/download-artifact@v8
        with: {name: lix, path: dl/lix}
      - name: Reference compiler revision
        id: ref
        run: echo "rev=$(git rev-parse --short=7 HEAD:haxe/upstream)" >> "$GITHUB_OUTPUT"
      - name: Cache the reference compiler
        uses: actions/cache@v6
        with:
          path: bin/reference
          key: reference-nightly-${{ steps.ref.outputs.rev }}
      - name: The port, lix and the reference
        run: |
          set -ex
          mkdir -p bin/port bin/lix
          tar xzf dl/hxmc-haxe-linux-x86_64.tar.gz -C dl
          cp dl/hxmc-haxe-linux-x86_64/haxe bin/port/haxe
          cp dl/lix/lix-linux-x86_64 bin/lix/lix && chmod +x bin/lix/lix bin/port/haxe
          for cmd in haxe haxelib neko; do ln -sf lix bin/lix/$cmd; done
          touch -d '2000-01-01' bin/lix/lix
          if [ ! -x bin/reference/haxe ]; then make -o bin/lix/lix reference; fi
          bin/reference/haxe -version
          bin/port/haxe -version
      - name: ${{ matrix.suite }} ${{ matrix.shard }}
        run: |
          set -x
          export HAXE_REFERENCE=$PWD/bin/reference/haxe HAXE_IN_HAXE_PORT=$PWD/bin/port/haxe
          S="bin/port/haxe -cp hxmc/test -cp haxe/test --run"
          failed=
          for suite in ${{ matrix.suite }}; do
            case "$suite" in
              hxb) $S Conformance -j 4 --summary "$GITHUB_STEP_SUMMARY" ;;
              macro) $S Conformance -j 4 --cases haxe/test/conformance-macro-cases.txt --summary "$GITHUB_STEP_SUMMARY" ;;
              display) $S Display -j 4 --summary "$GITHUB_STEP_SUMMARY" ;;
              server) $S Server -j 4 --summary "$GITHUB_STEP_SUMMARY" ;;
              jsonrpc) $S ServerJsonRpc --summary "$GITHUB_STEP_SUMMARY" ;;
              targets) $S UpstreamTargets -j 4 --summary "$GITHUB_STEP_SUMMARY" ;;
              haxelib) $S Haxelib --server --summary "$GITHUB_STEP_SUMMARY" ;;
              debugger) $S EvalDebugger --shard ${{ matrix.shard }} --summary "$GITHUB_STEP_SUMMARY" ;;
              fuzz)
                for lane in ${{ matrix.lanes }}; do
                  bin/port/haxe -cp haxe/test/fuzz -cp haxe/test --run Fuzz -j 4 --cases haxe/test/fuzz/cases --port $PWD/bin/port/haxe --lane $lane || failed="$failed $lane"
                  bin/port/haxe -cp haxe/test/fuzz -cp haxe/test --run Fuzz -j 4 -n 100 --port $PWD/bin/port/haxe --lane $lane || failed="$failed $lane"
                done ;;
            esac || failed="$failed $suite"
          done
          if [ -n "$failed" ]; then echo "failed:$failed"; exit 1; fi

  # the fuzzer's exec lanes (docs/testing.md): the kept programs and a random
  # batch run by the reference's Eval and built by hxmc (a native executable,
  # a wasm32-wasi module under node), what they print compared; one job per
  # lane, each with its own tool from the stage0
  fuzz-exec:
    needs: [changes, rt]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.rt.result == 'success' || needs.rt.result == 'skipped') && needs.changes.outputs.all == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lane: ['exec:interp,hxmc', 'exec:interp,hxmc-wasm']
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.rt_hit != 'true'
        with: {name: rt, path: bin/hxmc/rt}
      - name: Reference compiler revision
        id: ref
        run: echo "rev=$(git rev-parse --short=7 HEAD:haxe/upstream)" >> "$GITHUB_OUTPUT"
      - name: Cache the reference compiler
        uses: actions/cache@v6
        with:
          path: bin/reference
          key: reference-nightly-${{ steps.ref.outputs.rev }}
      - name: Runtime objects, the tool and the reference
        run: |
          set -ex
          make rt && touch bin/hxmc/rt/*/*.o
          make hxmc
          if [ ! -x bin/reference/haxe ]; then make lix reference; fi
          bin/reference/haxe -version
      - name: ${{ matrix.lane }}
        run: |
          set -x
          export HAXE_REFERENCE=$PWD/bin/reference/haxe
          ulimit -s unlimited
          F="bin/hxmc/hxmc -cp haxe/test/fuzz -cp haxe/test --run Fuzz -j 4 --lane ${{ matrix.lane }}"
          failed=
          $F --cases haxe/test/fuzz/cases || failed="$failed cases"
          $F -n 400 || failed="$failed random"
          if [ -n "$failed" ]; then echo "failed:$failed"; exit 1; fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with: {name: "fuzz-${{ strategy.job-index }}", path: "bin/test/fuzz/failures/", retention-days: 7, if-no-files-found: ignore}

  # on a machine of each target: the release binary, lix, hxmc's corpus and
  # the port's self-compile; the scripts run on the release binary's Eval
  test:
    needs: [changes, build, corpus]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.corpus.result == 'success' && needs.changes.outputs.all == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x86_64, pkg: linux-x86_64, corpus: unix, os: ubuntu-24.04}
          - {target: linux-arm64, pkg: linux-aarch64, corpus: unix, os: ubuntu-24.04-arm}
          - {target: windows-x86_64, pkg: windows-x86_64, corpus: windows, os: windows-2025}
          - {target: windows-arm64, pkg: windows-aarch64, corpus: windows, os: windows-11-arm}
          - {target: macos-x86_64, pkg: macos-x86_64, corpus: unix, os: macos-15-intel}
          - {target: macos-arm64, pkg: macos-aarch64, corpus: unix, os: macos-15}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            hxmc/test
            haxe/test
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with: {name: 'hxmc-haxe-${{ matrix.pkg }}', path: dl}
      - uses: actions/download-artifact@v8
        with: {name: 'corpus-${{ matrix.corpus }}', path: dl}
      - uses: actions/download-artifact@v8
        with: {name: hxmc-self, path: dl}
      - uses: actions/download-artifact@v8
        with: {name: lix, path: lix}
      - name: Unpack
        id: unpack
        run: |
          set -ex
          mkdir -p t corpus std-x
          case "${{ matrix.target }}" in
            windows-*)
              unzip -q dl/hxmc-haxe-${{ matrix.pkg }}.zip -d t
              echo "bin=$PWD/t/hxmc-haxe-${{ matrix.pkg }}/haxe.exe" >> "$GITHUB_OUTPUT"
              # a Windows path (C:/...) for the native program
              echo "std=$(cygpath -m "$PWD/t/hxmc-haxe-${{ matrix.pkg }}/std")" >> "$GITHUB_OUTPUT" ;;
            *)
              tar xzf dl/hxmc-haxe-${{ matrix.pkg }}.tar.gz -C t
              echo "bin=$PWD/t/hxmc-haxe-${{ matrix.pkg }}/haxe" >> "$GITHUB_OUTPUT"
              echo "std=$PWD/t/hxmc-haxe-${{ matrix.pkg }}/std" >> "$GITHUB_OUTPUT" ;;
          esac
          tar xzf dl/corpus-${{ matrix.target }}.tar.gz -C corpus
          tar xzf dl/std.tar.gz -C std-x
          tar xzf dl/src.tar.gz -C std-x
          ls -l t/*
      - name: Smoke test
        run: |
          export HAXE_STD_PATH="${{ steps.unpack.outputs.std }}"
          SMOKE_DIR="$RUNNER_TEMP/smoke" sh hxmc/test/smoke.sh "${{ steps.unpack.outputs.bin }}"
      - name: Smoke test (PowerShell, Windows paths)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:HAXE_STD_PATH = (Resolve-Path "t/hxmc-haxe-${{ matrix.pkg }}/std").Path
          $exe = (Resolve-Path "t/hxmc-haxe-${{ matrix.pkg }}/haxe.exe").Path
          New-Item -ItemType Directory -Force ps | Out-Null
          Set-Location ps
          Set-Content Main.hx 'class Main { static function main() { trace("hello from " + #if sys Sys.systemName() + " in " + Sys.getCwd() #else "js" #end); } }'
          $out = & $exe -main Main --interp
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $out
          # the native build's Eval host: Windows, with a drive letter
          if (-not ($out -match "hello from Windows in [A-Z]:\\")) { exit 1 }
          & $exe -main Main --js out.js
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node out.js
          & $exe -cp . -main Main --hxb out.hxb
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item out.hxb
      - name: lix
        run: |
          set -ex
          # installed as the site says: the platform's binary as lix, then lix shims
          # (a POSIX path for bash: on Windows, MSYS converts PATH for native programs)
          B="$RUNNER_TEMP/lix-bin"
          if [ "$RUNNER_OS" = Windows ]; then B=$(cygpath -u "$B"); fi
          mkdir -p "$B"
          if [ "$RUNNER_OS" = Windows ]; then
            cp lix/lix-${{ matrix.target }}.exe "$B/lix.exe"; L="$B/lix.exe"; H="$B/haxe.exe"
          else
            cp lix/lix-${{ matrix.target }} "$B/lix"; chmod +x "$B/lix"; L="$B/lix"; H="$B/haxe"
          fi
          "$L" --version
          "$L" shims
          ls -l "$B"
          # the commands on PATH (the libraries' install commands call lix)
          export PATH="$B:$PATH"
          export HAXESHIM_ROOT="$RUNNER_TEMP/lix-root"
          mkdir -p "$RUNNER_TEMP/lix-project/src" && cd "$RUNNER_TEMP/lix-project"
          "$L" scope create
          # downloads from GitHub's and haxe.org's servers stall now and then on the
          # runners (no data for 30 s, or a TCP timeout): tried again, as a person would
          retry() { for n in 1 2 3; do "$@" && return 0; echo "retry: $* failed (try $n)"; sleep 10; done; return 1; }
          # Haxe and neko have no Windows ARM64 builds, and lix (as upstream's)
          # maps no platform there ("Unsupported platform: unknown"): no downloads
          if [ "${{ matrix.target }}" = windows-arm64 ]; then exit 0; fi
          retry "$L" download
          retry "$L" install haxelib:tink_core
          cat haxe_libraries/tink_core.hxml .haxerc
          # a fresh clone's case: the libraries reinstalled from haxe_libraries
          retry "$L" install haxelib:tink_json
          rm -rf "$HAXESHIM_ROOT/haxe_libraries"
          retry "$L" download
          echo 'class Main { static function main() trace(tink.core.Outcome.Success(#if sys Sys.args() #else "js" #end)); }' > src/Main.hx
          # Haxe 4.3.7 has no Linux ARM64 build: lix (as the npm package)
          # downloads the x86-64 one there, which does not run
          if [ "${{ matrix.target }}" = linux-arm64 ]; then "$H" --run resolve-args -lib tink_json; exit 0; fi
          "$H" -version
          "$H" --run resolve-args -lib tink_core
          "$H" --run resolve-args -lib tink_json
          "$H" -cp src -lib tink_core --run Main a b
          "$H" -cp src -lib tink_core -main Main --js main.js && node main.js
      - name: Corpus
        if: always()
        run: |
          export HAXE_STD_PATH="${{ steps.unpack.outputs.std }}"
          "${{ steps.unpack.outputs.bin }}" -cp hxmc/test -cp haxe/test --run Check corpus --summary "$GITHUB_STEP_SUMMARY"
      # the free nursery filled with a pattern: allocations that are not
      # initialized and references a collection missed read it at once
      - name: Corpus, RT_VERIFY=1
        if: always()
        run: |
          export HAXE_STD_PATH="${{ steps.unpack.outputs.std }}"
          RT_VERIFY=1 "${{ steps.unpack.outputs.bin }}" -cp hxmc/test -cp haxe/test --run Check corpus --summary "$GITHUB_STEP_SUMMARY"
      # a debugger on a -debug build (DebugCheck --run: a breakpoint at a Haxe
      # line, the backtrace's Haxe functions and lines): gdb on Linux, lldb on
      # macOS; Windows: the unwind tables through the corpus (UnwindTables)
      - name: Debugger
        if: always() && runner.os != 'Windows'
        run: |
          set -ex
          if [ "$RUNNER_OS" = Linux ] && ! command -v gdb > /dev/null; then sudo apt-get install -qqy gdb; fi
          export HAXE_STD_PATH="${{ steps.unpack.outputs.std }}"
          "${{ steps.unpack.outputs.bin }}" -cp hxmc/test -cp haxe/test --run DebugCheck --run corpus/_debug
      # Linux: the corpus in the dynamic glibc mode (-D hxmc.libc=glibc) against
      # the runner's glibc, and against glibc 2.17, the floor its symbol
      # versions are pinned to (CentOS 7's, in a container; the release
      # binary that runs the check is static)
      - name: Corpus, glibc mode
        if: always() && runner.os == 'Linux'
        run: |
          set -ex
          mkdir -p corpus-glibc
          tar xzf dl/corpus-${{ matrix.target }}-glibc.tar.gz -C corpus-glibc
          export HAXE_STD_PATH="${{ steps.unpack.outputs.std }}"
          "${{ steps.unpack.outputs.bin }}" -cp hxmc/test -cp haxe/test --run ElfCheck corpus-glibc
          "${{ steps.unpack.outputs.bin }}" -cp hxmc/test -cp haxe/test --run Check corpus-glibc --summary "$GITHUB_STEP_SUMMARY"
          RT_VERIFY=1 "${{ steps.unpack.outputs.bin }}" -cp hxmc/test -cp haxe/test --run Check corpus-glibc --summary "$GITHUB_STEP_SUMMARY"
      - name: Corpus, glibc mode, glibc 2.17
        if: always() && runner.os == 'Linux'
        run: |
          set -ex
          docker run --rm --network host -v "$PWD:/w" -w /w -e HAXE_STD_PATH=/w/t/hxmc-haxe-${{ matrix.pkg }}/std centos:7 \
            sh -c 'ldd --version | head -1 && t/hxmc-haxe-${{ matrix.pkg }}/haxe -cp hxmc/test -cp haxe/test --run Check corpus-glibc'
      - name: Port self-compile
        if: always()
        run: |
          set -ex
          root="$SELF_ROOT"
          exe="${{ steps.unpack.outputs.bin }}"
          if [ "$RUNNER_OS" = Linux ]; then sudo mkdir -p "$root" && sudo chown "$USER" "$root"; fi
          if [ "$RUNNER_OS" = Windows ]; then root="$(cygpath -w "$RUNNER_TEMP")\\hih"; fi
          if [ "$RUNNER_OS" = Windows ]; then exe="$(cygpath -m "$exe")"; fi
          export HAXE_STD_PATH="${{ steps.unpack.outputs.std }}"
          # (MSYS would rewrite the reference's root, a POSIX path)
          MSYS_NO_PATHCONV=1 "$exe" -cp hxmc/test -cp haxe/test --run Selfcheck --port "$exe" --src std-x/src --std std-x/std --ref dl/self-ref.hxb --ref-root "$SELF_ROOT" --root "$root" --summary "$GITHUB_STEP_SUMMARY"

  # the WebAssembly corpus under node 22 and wasmtime, the port as a module
  # compiling itself under both
  wasm:
    needs: [changes, build, corpus]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.corpus.result == 'success' && needs.changes.outputs.all == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            hxmc/test
            haxe/test
            hxmc/bootstrap
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: wasmtime
        run: |
          set -ex
          curl -sSfL "https://github.com/bytecodealliance/wasmtime/releases/download/v$WASMTIME_VERSION/wasmtime-v$WASMTIME_VERSION-x86_64-linux.tar.xz" | tar xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasmtime-v$WASMTIME_VERSION-x86_64-linux" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v8
        with: {name: corpus-wasm, path: dl}
      - uses: actions/download-artifact@v8
        with: {name: hxmc-self, path: dl}
      - uses: actions/download-artifact@v8
        with: {name: hxmc-haxe-linux-x86_64, path: dl}
      - name: Unpack
        run: |
          set -ex
          mkdir -p corpus corpus-legacy port std-x
          tar xzf dl/corpus-wasm32-wasi.tar.gz -C corpus
          tar xzf dl/corpus-wasm32-wasi-legacy.tar.gz -C corpus-legacy
          tar xzf dl/corpus-wasm32-wasi-port.tar.gz -C port
          tar xzf dl/std.tar.gz -C std-x
          tar xzf dl/src.tar.gz -C std-x
          tar xzf dl/hxmc-haxe-linux-x86_64.tar.gz -C dl
          echo "H=$PWD/dl/hxmc-haxe-linux-x86_64/haxe" >> "$GITHUB_ENV"
          echo "HAXE_STD_PATH=$PWD/dl/hxmc-haxe-linux-x86_64/std" >> "$GITHUB_ENV"
          echo "NODE_WASI=node --no-warnings --stack-size=8000 $PWD/hxmc/bootstrap/wasi.mjs" >> "$GITHUB_ENV"
          sudo mkdir -p "$SELF_ROOT" && sudo chown "$USER" "$SELF_ROOT"
      - name: Corpus under node
        if: always()
        run: $H -cp hxmc/test -cp haxe/test --run Check corpus --runner "$NODE_WASI" --summary "$GITHUB_STEP_SUMMARY"
      - name: Corpus under node, RT_VERIFY=1
        if: always()
        run: RT_VERIFY=1 $H -cp hxmc/test -cp haxe/test --run Check corpus --runner "$NODE_WASI" --summary "$GITHUB_STEP_SUMMARY"
      # built with -D hxmc.wasm-eh=legacy (try/catch_all/rethrow, for engines
      # without exnref), under node without exnref
      - name: Corpus under node, legacy exception handling
        if: always()
        run: $H -cp hxmc/test -cp haxe/test --run Check corpus-legacy --runner "env HXMC_WASM_EXNREF=0 $NODE_WASI" --summary "$GITHUB_STEP_SUMMARY"
      - name: Corpus under wasmtime
        if: always()
        run: $H -cp hxmc/test -cp haxe/test --run Check corpus --runner "wasmtime run -W exceptions=y --dir . --dir / --env RT_MINOR_KB" --summary "$GITHUB_STEP_SUMMARY"
      - name: Corpus under wasmtime, 16 KB nursery
        if: always()
        run: RT_MINOR_KB=16 $H -cp hxmc/test -cp haxe/test --run Check corpus --runner "wasmtime run -W exceptions=y --dir . --dir / --env RT_MINOR_KB" --summary "$GITHUB_STEP_SUMMARY"
      - name: Port self-compile under node
        if: always()
        run: $H -cp hxmc/test -cp haxe/test --run Selfcheck --runner "$NODE_WASI" --port port/haxe.wasm --src std-x/src --std std-x/std --ref dl/self-ref.hxb --ref-root "$SELF_ROOT" --root "$SELF_ROOT" --summary "$GITHUB_STEP_SUMMARY"
      - name: Port self-compile under node, legacy exception handling
        if: always()
        run: $H -cp hxmc/test -cp haxe/test --run Selfcheck --runner "env HXMC_WASM_EXNREF=0 $NODE_WASI" --port port/haxe-legacy.wasm --src std-x/src --std std-x/std --ref dl/self-ref.hxb --ref-root "$SELF_ROOT" --root "$SELF_ROOT" --summary "$GITHUB_STEP_SUMMARY"
      - name: Port self-compile under wasmtime
        if: always()
        run: $H -cp hxmc/test -cp haxe/test --run Selfcheck --runner "wasmtime run -W exceptions=y -W max-wasm-stack=67108864 --dir / --env HAXE_STD_PATH --env PWD" --port port/haxe.wasm --src std-x/src --std std-x/std --ref dl/self-ref.hxb --ref-root "$SELF_ROOT" --root "$SELF_ROOT" --summary "$GITHUB_STEP_SUMMARY"

  # the website in the browsers' engines (make site-check,
  # site/tools/browser-test.mjs): links; every page in Chromium, the key
  # pages in Firefox and WebKit, at a desktop's and a phone's width
  # (rendered, islands hydrated, no errors, no horizontal scrolling); the
  # examples running, the triangle and the cube against packages/gfx/test's
  # golden images (WebGPU and WebGL2 in Chromium, WebGL2 in Firefox and
  # WebKit; Firefox's in a headed Firefox under Xvfb on Mesa's llvmpipe:
  # headless, it has no WebGL); the playground's worker (--interp, HXB,
  # diagnostics, completion) with both modules, the page's choice of module,
  # also in a Chromium without exnref
  playground:
    needs: [changes, site]
    if: ${{ !cancelled() && needs.site.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            site/tools
            packages/gfx/test
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with: {name: site, path: site-dist}
      - name: The website in Chromium, Firefox and WebKit
        run: |
          set -ex
          npm install --no-save --silent playwright@1.56.1
          npx playwright install --with-deps chromium firefox webkit > /dev/null
          sudo apt-get install -qqy --no-install-recommends libgl1-mesa-dri libegl-mesa0 xvfb xauth > /dev/null
          xvfb-run -a -s "-screen 0 1280x1024x24" node site/tools/browser-test.mjs site-dist chromium firefox webkit

  # the npm packages in fresh projects, on each target's machine (every
  # package installed before publish-npm publishes them): @hxmc/cli with its
  # platform package (native at once, node_modules/.bin/haxe the native
  # compiler on Unix; -lib from node_modules; with --ignore-scripts after the
  # first call) on all six every run; and the full set on linux-x64 (on all
  # six on main, tags and nightly: changes.outputs.npm_full): lix with
  # dist/; the WebAssembly fallback (no platform package: @hxmc/wasm downloaded
  # into the cache, here from the local tarball through HXMC_WASM_TARBALL, or
  # installed); @hxmc/source (an edit, hxmc-rebuild, haxe runs the rebuilt
  # compiler, --reset)
  # (build: lix)
  npm:
    needs: [changes, npm-pack, build]
    if: ${{ !cancelled() && needs.npm-pack.result == 'success' && needs.build.result == 'success' && needs.changes.outputs.all == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, plat: linux-x64, lix: linux-x86_64, full: true}
          - {os: ubuntu-24.04-arm, plat: linux-arm64}
          - {os: macos-15, plat: darwin-arm64, lix: macos-arm64}
          - {os: macos-15-intel, plat: darwin-x64}
          - {os: windows-2025, plat: win32-x64}
          - {os: windows-11-arm, plat: win32-arm64}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      HXMC_CACHE: ${{ github.workspace }}/hxmc-cache
      FULL: ${{ matrix.full || needs.changes.outputs.npm_full == 'true' }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with: {name: npm, path: dl}
      - uses: actions/download-artifact@v8
        if: matrix.lix && env.FULL == 'true'
        with: {name: lix, path: dl/lix}
      - name: Install @hxmc/cli and its platform package
        run: |
          set -ex
          v=$(cat dl/VERSION)
          mkdir -p "$RUNNER_TEMP/app/src" && cd "$RUNNER_TEMP/app"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/dl/hxmc-cli-$v.tgz" "$GITHUB_WORKSPACE/dl/hxmc-${{ matrix.plat }}-$v.tgz"
          printf 'class Main { static function main() { Sys.println("hello from " + Sys.systemName()); } }\n' > src/Main.hx
          printf 'class Js { static function main() { trace("hello from js"); } }\n' > src/Js.hx
          printf -- '-cp src\n-main Main\n--custom-target hxmc=bin/app\n' > build.hxml
          # (no compiler sources and no WebAssembly compiler in @hxmc/cli)
          test ! -e node_modules/@hxmc/cli/haxe/src && test ! -e node_modules/@hxmc/cli/hxmc/bootstrap/haxe.wasm
          # Unix: the postinstall put the native compiler where npm's link points
          if [ "$RUNNER_OS" != Windows ]; then head -c 4 node_modules/.bin/haxe | od -An -tx1 | tee magic.txt; ! grep -q "23 21" magic.txt; fi
      - name: Native at once
        run: |
          set -ex
          cd "$RUNNER_TEMP/app"
          npx haxe --version > version.out 2> version.err
          cat version.out
          test ! -s version.err
          test ! -e "$HXMC_CACHE/npm"
          npx haxe -cp src -main Main --interp | tee out.txt
          grep -q "hello from" out.txt
          time npx haxe build.hxml
          if [ "$RUNNER_OS" = Windows ]; then ./bin/app.exe; ls -l node_modules/@hxmc/cli/dist/haxe.exe; else ./bin/app; fi
          npx haxe -cp src -main Js --js main.js && node main.js
      # -lib from node_modules (hxmc/test/NodeLibs.hx), by the native compiler
      # run without node (npm's link to it on Unix, dist/haxe.exe on Windows)
      - name: -lib from node_modules
        run: |
          set -ex
          cd "$RUNNER_TEMP/app"
          if [ "$RUNNER_OS" = Windows ]; then hx="$PWD/node_modules/@hxmc/cli/dist/haxe.exe"; else hx="$PWD/node_modules/.bin/haxe"; fi
          "$hx" -cp "$GITHUB_WORKSPACE/dl" --run NodeLibs --haxe "$hx" --dir "$RUNNER_TEMP/node-libs"
      - name: With --ignore-scripts, the first call installs the native compiler
        if: runner.os != 'Windows'
        run: |
          set -ex
          v=$(cat dl/VERSION)
          mkdir -p "$RUNNER_TEMP/noscripts" && cd "$RUNNER_TEMP/noscripts"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund "$GITHUB_WORKSPACE/dl/hxmc-cli-$v.tgz" "$GITHUB_WORKSPACE/dl/hxmc-${{ matrix.plat }}-$v.tgz"
          head -c 2 node_modules/.bin/haxe | grep -q '#!'
          npx haxe --version
          head -c 4 node_modules/.bin/haxe | od -An -tx1 | tee magic.txt; ! grep -q "23 21" magic.txt
      # lix with the package's installation (dist/) as its Haxe
      - name: lix
        if: matrix.lix && env.FULL == 'true'
        run: |
          set -ex
          cd "$RUNNER_TEMP/app"
          export HAXESHIM_ROOT="$RUNNER_TEMP/lix-root"
          mkdir -p "$RUNNER_TEMP/lix" && cp "$GITHUB_WORKSPACE/dl/lix/lix-${{ matrix.lix }}" "$RUNNER_TEMP/lix/lix" && chmod +x "$RUNNER_TEMP/lix/lix"
          export PATH="$RUNNER_TEMP/lix:$PATH"
          lix shims
          lix scope create
          lix use haxe ./node_modules/@hxmc/cli/dist
          cat .haxerc
          haxe --version
          printf -- '-cp src\n-main Main\n--custom-target hxmc=bin/applix\n' > lix.hxml
          haxe lix.hxml
          ./bin/applix
      # the WebAssembly fallback: without a native compiler (no platform
      # package) the first call downloads @hxmc/wasm into the cache, checked
      # against the integrity @hxmc/cli pins (the local tarball here: this
      # version is not on the registry yet)
      - name: WebAssembly fallback, downloaded
        if: env.FULL == 'true'
        env:
          HXMC_PLATFORM_PACKAGE: '0'
          HXMC_CACHE: ${{ github.workspace }}/hxmc-cache-wasm
        run: |
          set -ex
          v=$(cat dl/VERSION)
          mkdir -p "$RUNNER_TEMP/fallback/src" && cd "$RUNNER_TEMP/fallback"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/dl/hxmc-cli-$v.tgz"
          cp "$RUNNER_TEMP/app/src/Main.hx" src/
          # offline: one line on stderr, a non-zero exit
          if HXMC_WASM_TARBALL="$RUNNER_TEMP/missing.tgz" npx haxe --version > off.out 2> off.err; then exit 1; fi
          cat off.err; grep -q "could not be downloaded" off.err; test ! -s off.out
          # a tarball that is not the pinned one
          if HXMC_WASM_TARBALL="$GITHUB_WORKSPACE/dl/hxmc-source-$v.tgz" npx haxe --version 2> bad.err; then exit 1; fi
          grep -q "integrity mismatch" bad.err
          export HXMC_WASM_TARBALL="$GITHUB_WORKSPACE/dl/hxmc-wasm-$v.tgz"
          npx haxe --version > version.out 2> version.err
          cat version.out version.err
          test ! -s version.err
          test -f "$HXMC_CACHE/npm/$v/wasm/haxe.wasm"
          # (from the cache now)
          HXMC_WASM_TARBALL="$RUNNER_TEMP/missing.tgz" npx haxe -cp src -main Main --custom-target hxmc=bin/app
          if [ "$RUNNER_OS" = Windows ]; then ./bin/app.exe; else ./bin/app; fi
          npx haxe -cp src -main Main --interp | tee out.txt
          grep -q "hello from Wasi" out.txt
      # @hxmc/wasm installed (WebContainers, noexec sandboxes): used, nothing downloaded
      - name: WebAssembly fallback, installed
        if: env.FULL == 'true'
        env:
          HXMC_PLATFORM_PACKAGE: '0'
          HXMC_CACHE: ${{ github.workspace }}/hxmc-cache-wasm2
          HXMC_WASM_TARBALL: ${{ runner.temp }}/missing.tgz
        run: |
          set -ex
          v=$(cat dl/VERSION)
          mkdir -p "$RUNNER_TEMP/wasmpkg/src" && cd "$RUNNER_TEMP/wasmpkg"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/dl/hxmc-cli-$v.tgz" "$GITHUB_WORKSPACE/dl/hxmc-wasm-$v.tgz"
          cp "$RUNNER_TEMP/app/src/Main.hx" src/
          npx haxe -cp src -main Main --interp | tee out.txt
          grep -q "hello from Wasi" out.txt
          test ! -e "$HXMC_CACHE/npm"
          # -lib from node_modules, by the WebAssembly compiler
          mkdir -p node_modules/hxdemo/src/demo
          printf '{"name": "hxdemo", "version": "1.0.0", "haxe": {"name": "hxdemo", "classPath": "src"}}\n' > node_modules/hxdemo/package.json
          printf 'package demo;\nclass Demo {\n\tpublic static function hi() return "hi from node_modules";\n}\n' > node_modules/hxdemo/src/demo/Demo.hx
          printf 'class UseDemo {\n\tstatic function main() Sys.println(demo.Demo.hi());\n}\n' > src/UseDemo.hx
          npx haxe -cp src -lib hxdemo -main UseDemo --interp | tee demo.txt
          grep -q "hi from node_modules" demo.txt
      # @hxmc/source: hxmc-rebuild builds the edited compiler with the native
      # one, haxe runs it while @hxmc/source is installed, --reset returns to
      # the published one
      - name: hxmc-rebuild
        if: env.FULL == 'true'
        env:
          HXMC_CACHE: ${{ github.workspace }}/hxmc-cache-source
        run: |
          set -ex
          v=$(cat dl/VERSION)
          mkdir -p "$RUNNER_TEMP/source/src" && cd "$RUNNER_TEMP/source"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/dl/hxmc-cli-$v.tgz" "$GITHUB_WORKSPACE/dl/hxmc-${{ matrix.plat }}-$v.tgz" "$GITHUB_WORKSPACE/dl/hxmc-source-$v.tgz"
          cp "$RUNNER_TEMP/app/src/Main.hx" src/
          sed -i.bak 's/"preview\.1"/"preview.1.rebuilt"/' node_modules/@hxmc/source/haxe/src/core/Globals.hx
          grep -q rebuilt node_modules/@hxmc/source/haxe/src/core/Globals.hx
          time npx hxmc-rebuild
          npx haxe --version | tee version.out
          grep -q "rebuilt" version.out
          npx haxe -cp src -main Main --custom-target hxmc=bin/app
          if [ "$RUNNER_OS" = Windows ]; then ./bin/app.exe; else ./bin/app; fi
          npx hxmc-rebuild --reset
          npx haxe --version | tee version.out
          ! grep -q "rebuilt" version.out
          if [ "$RUNNER_OS" != Windows ]; then head -c 4 node_modules/.bin/haxe | od -An -tx1 | tee magic.txt; ! grep -q "23 21" magic.txt; fi

  # upstream Haxe's compiler-side suite (RunCi macro) with the release
  # binaries as haxe (upstream-tests.yml)
  upstream-tests:
    needs: [changes, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.changes.outputs.all == 'true' }}
    uses: ./.github/workflows/upstream-tests.yml

  # npm: the nine packages at one version (npm-pack's), installed and
  # tested by the npm job: the six platform packages, @hxmc/wasm,
  # @hxmc/source, then @hxmc/cli: on v* tags (dist-tag latest) and pushes to main (a nightly, dist-tag
  # next); then every source-only package (packages/<name> with a version of
  # its own: bin/npm/packages/) at its version when that is not on npm yet
  # (dist-tag latest, next for a prerelease); never from other branches.
  # After every check (the full npm set on all six machines: npm_full).
  publish-npm:
    needs: [changes, build, corpus, crosshost, measure, npm-pack, site, gfx, gfx-arm64, gfx-windows, gfx-macos, conformance, fuzz-exec, test, wasm, playground, npm]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.build.result == 'success' && needs.corpus.result == 'success' && needs.crosshost.result == 'success' && needs.measure.result == 'success' && needs.npm-pack.result == 'success' && needs.site.result == 'success' && needs.gfx.result == 'success' && needs.gfx-arm64.result == 'success' && needs.gfx-windows.result == 'success' && needs.gfx-macos.result == 'success' && needs.conformance.result == 'success' && needs.fuzz-exec.result == 'success' && needs.test.result == 'success' && needs.wasm.result == 'success' && needs.playground.result == 'success' && needs.npm.result == 'success' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with: {name: npm, path: dl}
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -ex
          v=$(cat dl/VERSION)
          tag=latest
          case "$GITHUB_REF" in refs/heads/main) tag=next ;; esac
          # a tarball's path starts with ./ (npm reads dl/x.tgz as a GitHub
          # user/repo); versions already published are skipped, so a run that
          # stopped halfway can be run again
          publish() {
            if npm view "$1@$v" version >/dev/null 2>&1; then echo "$1@$v is published already"; return; fi
            npm publish --access public --provenance --tag $tag "$2"
          }
          # (all nine at this version, each one's dependencies first: @hxmc/cli
          # last, whose optional dependencies and pinned @hxmc/wasm must exist)
          for p in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64 wasm source cli; do
            test "$(tar xzf "dl/hxmc-$p-$v.tgz" -O package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).version')" = "$v"
          done
          for p in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64 wasm source cli; do
            publish "@hxmc/$p" "./dl/hxmc-$p-$v.tgz"
          done
          # the source-only packages, at their own versions
          for f in dl/packages/*.tgz; do
            test -e "$f" || continue
            meta=$(tar xzf "$f" -O package/package.json | node -p 'const p = JSON.parse(require("fs").readFileSync(0)); p.name + " " + p.version')
            name=${meta% *} pv=${meta#* }
            if npm view "$name@$pv" version >/dev/null 2>&1; then echo "$name@$pv is published already"; continue; fi
            case "$pv" in *-*) ptag=next ;; *) ptag=latest ;; esac
            npm publish --access public --provenance --tag $ptag "./$f"
          done

  # nightly on main, a release on v* tags
  release:
    needs: [changes, build, corpus, crosshost, measure, npm-pack, site, gfx, gfx-arm64, gfx-windows, gfx-macos, conformance, fuzz-exec, test, wasm, playground, npm]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.build.result == 'success' && needs.corpus.result == 'success' && needs.crosshost.result == 'success' && needs.measure.result == 'success' && needs.npm-pack.result == 'success' && needs.site.result == 'success' && needs.gfx.result == 'success' && needs.gfx-arm64.result == 'success' && needs.gfx-windows.result == 'success' && needs.gfx-macos.result == 'success' && needs.conformance.result == 'success' && needs.fuzz-exec.result == 'success' && needs.test.result == 'success' && needs.wasm.result == 'success' && needs.playground.result == 'success' && needs.npm.result == 'success' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: hxmc-haxe-*
          path: assets
          merge-multiple: true
      - name: The npm package
        uses: actions/download-artifact@v8
        with: {name: npm, path: npm}
      - name: Publish
        run: |
          set -ex
          cp npm/hxmc-cli-$(cat npm/VERSION).tgz assets/
          ls -l assets
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-9)
          NOTES="Built from $GITHUB_SHA by hxmc (the port compiled to machine code for each target, cross-built on Linux, with mbedtls and libuv).

          - hxmc-haxe-<os>-<arch>.tar.gz: Linux and macOS, haxe with std/; set HAXE_STD_PATH to it.
          - hxmc-haxe-windows-<arch>.zip: Windows, haxe.exe with std/; set HAXE_STD_PATH to it.
          - hxmc-cli-<version>.tgz: the npm package @hxmc/cli (its platform packages, @hxmc/wasm and @hxmc/source are on npm).

          Each archive carries the licenses: LICENSE and COPYING (the port), LICENSE.mbedtls and LICENSE.libuv."
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG=$GITHUB_REF_NAME
            gh release create "$TAG" --verify-tag --title "hxmc $TAG" --notes "$NOTES" assets/*
          else
            TAG=nightly
            if gh release view "$TAG" > /dev/null 2>&1; then
              # move the tag, then replace the assets in place (the download URLs stay valid)
              gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true
              gh release upload "$TAG" assets/* --clobber
              gh release edit "$TAG" --prerelease --title "Nightly ($SHORT)" --notes "$NOTES"
            else
              gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "Nightly ($SHORT)" --notes "$NOTES" assets/*
            fi
          fi

  pages:
    needs: [changes, build, corpus, crosshost, measure, npm-pack, site, gfx, gfx-arm64, gfx-windows, gfx-macos, wasm, playground]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.build.result == 'success' && needs.corpus.result == 'success' && needs.crosshost.result == 'success' && needs.measure.result == 'success' && needs.npm-pack.result == 'success' && needs.site.result == 'success' && needs.gfx.result == 'success' && needs.gfx-arm64.result == 'success' && needs.gfx-windows.result == 'success' && needs.gfx-macos.result == 'success' && needs.wasm.result == 'success' && needs.playground.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
