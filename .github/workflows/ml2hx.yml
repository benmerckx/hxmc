name: ml2hx
on:
  pull_request:
    paths:
      - 'tools/ml2hx/**'
      - 'generated/compiler/**'
      - 'haxe/upstream'
      - 'haxe/src/**'
      - 'Makefile'
      - '.github/workflows/ml2hx.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: make generate-check
      - run: make port port-generated reference
      - run: make ml2hx-test
      - run: make test test-display test-server PORT_BIN=bin/ml2hx/haxe
      - run: make test PORT_BIN=bin/ml2hx/haxe CASES_FILE=haxe/test/conformance-macro-cases.txt
      - run: make ml2hx-history
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ml2hx-history
          path: bin/ml2hx/matrix/results.json
