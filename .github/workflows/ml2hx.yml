name: ml2hx
on:
  pull_request:
    paths:
      - 'tools/ml2hx/**'
      - 'haxe/upstream'
      - 'Makefile'
      - '.github/workflows/ml2hx.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.3.0
      - run: sudo apt-get update && sudo apt-get install -y libpcre2-dev zlib1g-dev libmbedtls-dev neko-dev pkg-config
      - run: opam install ./haxe/upstream --deps-only -y
      - run: make ml2hx-test
      - run: opam exec -- make generate
