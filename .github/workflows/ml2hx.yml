name: ml2hx
on:
  pull_request:
    paths:
      - 'tools/ml2hx/**'
      - 'haxe/upstream'
      - 'Makefile'
      - '.github/workflows/ml2hx.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.3.0
      - run: sudo apt-get update && sudo apt-get install -y libpcre2-dev zlib1g-dev libmbedtls-dev neko-dev pkg-config
      - run: opam install ./haxe/upstream --deps-only -y
      # the native frontend (compiler-libs of this switch), the semantic
      # tests (OCaml's output against the generated Haxe's, on hxmc's
      # stage0), then the count of modules that emit and type
      - run: opam exec -- make ml2hx-frontend
      - run: opam exec -- make ml2hx-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml2hx-check
          path: bin/ml2hx/check.json
