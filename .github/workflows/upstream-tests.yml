# Upstream Haxe's compiler-side CI suite (haxe/upstream/.github/workflows/
# main.yml: the macro job of linux-test, mac-test and windows64-test: the unit
# tests in the macro context and their HXB round trip, null safety, the misc
# projects, sys on Eval, threads, the third-party projects) with the port as
# `haxe`. The target suites are not run here: their outputs are compared with
# the reference's instead (build.yml, conformance: haxe/test/UpstreamTargets.hx).
#
# Called by build.yml once its `build` job has uploaded the release binaries;
# nothing is rebuilt here. Each job puts the release binary on PATH as `haxe`
# with HAXE_STD_PATH at the submodule's std, builds haxelib from
# haxe/upstream/extra/haxelib_src with that binary (client.hxml to run.n, then
# `nekotools boot` as upstream's Makefiles do), and runs RunCi in
# haxe/upstream/tests (`haxe --run RunCi macro`; on Windows `haxe RunCi.hxml`
# with TEST set, as upstream), straight from the submodule.
name: upstream-tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux-test:
    runs-on: ubuntu-22.04${{ matrix.arch == 'arm64' && '-arm' || '' }}
    env:
      PLATFORM: linux${{ matrix.arch == 'arm64' && '-arm' || '' }}64
      HAXE_STD_PATH: ${{ github.workspace }}/haxe/upstream/std
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: hxmc-haxe-linux-${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}
          path: linuxBinaries
      - uses: ./haxe/upstream/.github/actions/setup-neko
      - name: Setup Haxe
        run: |
          set -ex
          tar -xf linuxBinaries/*.tar.gz -C linuxBinaries --strip-components=1
          sudo mkdir -p /usr/local/bin/
          sudo ln -s `pwd`/linuxBinaries/haxe /usr/local/bin/haxe
      # upstream's linux-build job (make haxelib), with the port as haxe
      - name: Build haxelib
        working-directory: ${{ github.workspace }}/haxe/upstream/extra/haxelib_src
        run: |
          set -ex
          haxe client.hxml
          nekotools boot -c run.n
          cc run.c -o haxelib -I/usr/local/include -L"$NEKOPATH" -lneko -Wl,-rpath,"$NEKOPATH"
          sudo ln -s `pwd`/haxelib /usr/local/bin/haxelib
      - name: Print Haxe version
        run: haxe -version
      - name: Setup haxelib
        run: |
          set -ex
          mkdir ~/haxelib
          haxelib setup ~/haxelib
      # round trips of multi-byte strings through Eval's sys.io.Process, four
      # runs at once (haxe/test/IpcStress.hx): upstream's sys test runs each once
      - name: Process round trips under Eval
        run: |
          set -e
          pids=
          for i in 1 2 3 4; do
            IPC_STRESS_DIR="$RUNNER_TEMP/ipc$i" haxe -cp haxe/test --run IpcStress "$(command -v haxe)" 25 > "$RUNNER_TEMP/ipc$i.log" 2>&1 &
            pids="$pids $!"
          done
          fail=0
          for p in $pids; do wait $p || fail=1; done
          cat "$RUNNER_TEMP"/ipc?.log
          exit $fail
        timeout-minutes: 15
      - name: Test
        run: haxe --run RunCi macro
        working-directory: ${{github.workspace}}/haxe/upstream/tests
        timeout-minutes: 25

  mac-test:
    runs-on: macos-latest
    env:
      PLATFORM: mac-universal
      HAXE_STD_PATH: ${{ github.workspace }}/haxe/upstream/std
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: hxmc-haxe-macos-aarch64
          path: macBinaries
      - uses: ./haxe/upstream/.github/actions/setup-neko
      - name: Setup Haxe
        run: |
          set -ex
          tar -xf macBinaries/*.tar.gz -C macBinaries --strip-components=1
          sudo mkdir -p /usr/local/bin/
          sudo ln -s `pwd`/macBinaries/haxe /usr/local/bin/haxe
      - name: Build haxelib
        working-directory: ${{ github.workspace }}/haxe/upstream/extra/haxelib_src
        run: |
          set -ex
          haxe client.hxml
          nekotools boot -c run.n
          cc run.c -o haxelib -I/usr/local/include -L"$NEKOPATH" -lneko -Wl,-rpath,"$NEKOPATH"
          sudo ln -s `pwd`/haxelib /usr/local/bin/haxelib
      - name: Print Haxe version
        run: haxe -version
      - name: Setup haxelib
        run: |
          set -ex
          mkdir ~/haxelib
          haxelib setup ~/haxelib
      - name: Test
        run: |
          # disable invalid Unicode filenames on APFS (as upstream)
          echo "" > sys/compile-fs.hxml
          haxe --run RunCi macro
          git checkout sys/compile-fs.hxml
        working-directory: ${{github.workspace}}/haxe/upstream/tests
        timeout-minutes: 60

  windows64-test:
    runs-on: windows-2025-vs2026
    env:
      PLATFORM: windows64
      TEST: macro
      ARCH: 64
      HAXE_STD_PATH: ${{ github.workspace }}\haxe\upstream\std
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: hxmc-haxe-windows-x86_64
          path: win64Binaries
      - uses: ./haxe/upstream/.github/actions/setup-neko
      - name: Setup Haxe
        shell: pwsh
        run: |
          Expand-Archive win64Binaries/*.zip -DestinationPath win64Binaries
          Set-PSDebug -Trace 1
          $HAXEPATH = (Get-ChildItem win64Binaries/hxmc-haxe-windows-* -Directory).FullName
          echo $HAXEPATH >> $env:GITHUB_PATH
          echo "HAXEPATH=$HAXEPATH" >> $env:GITHUB_ENV
          echo "HAXELIB_ROOT=$HAXEPATH\lib" >> $env:GITHUB_ENV
      # upstream's windows64-build job (make -f Makefile.win haxelib), with the port as haxe
      - name: Build haxelib
        shell: pwsh
        working-directory: ${{ github.workspace }}/haxe/upstream/extra/haxelib_src
        run: |
          Set-PSDebug -Trace 1
          haxe client.hxml
          if ($LASTEXITCODE -ne 0) { exit 1 }
          nekotools boot run.n
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Move-Item run.exe "$env:HAXEPATH\haxelib.exe"
      - name: Print Haxe version
        shell: pwsh
        run: haxe -version
      - name: Setup haxelib
        shell: pwsh
        run: |
          mkdir "$env:HAXELIB_ROOT"
          haxelib setup "$env:HAXELIB_ROOT"
      - name: Test
        shell: pwsh
        run: haxe RunCi.hxml
        working-directory: ${{github.workspace}}/haxe/upstream/tests
        timeout-minutes: 25
