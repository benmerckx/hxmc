# Temporary (issue #43): measures NullAccessCrash's crash on the runners with
# main's runtime and with the fix, (the corpus staging loop ran in the first
# commit's run). The branch is deleted after.
name: stress-43
on:
  push:
    branches: [stress-43]
permissions:
  contents: read
jobs:
  nullcrash:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        ref: [main, fix]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          ref: ${{ matrix.ref == 'main' && 'main' || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: How this runner takes core dumps
        run: |
          git log --oneline -1
          echo "core_pattern: $(cat /proc/sys/kernel/core_pattern)"; echo "ulimit -c: $(ulimit -c)"
          systemd-analyze cat-config systemd/coredump.conf 2>/dev/null | grep -v '^#' | grep . || true
          dpkg -l 2>/dev/null | grep -E 'apport|systemd-coredump' || true
      - name: The tool
        run: make rt && make hxmc
      - name: NullAccessCrash
        run: |
          set +e
          mkdir -p t
          bin/hxmc/hxmc t/m -cp hxmc/test/cases -cp bin/hxmc/std -main NullAccessCrash --custom-target hxmc | tail -1
          for i in 1 2; do
            s=$(date +%s%N); RT_MINOR_KB=64 timeout 600 t/m; c=$?; e=$(date +%s%N)
            echo "run $i: exit $c in $(( (e - s) / 1000000 )) ms"
          done
          sudo coredumpctl list --no-pager 2>&1 | tail -5 || true
          sudo coredumpctl info --no-pager 2>&1 | grep -iE 'signal|storage|size|truncat' || true
          sudo journalctl --no-pager -t systemd-coredump 2>&1 | tail -6 || true
      - name: CoreDumpSize
        if: matrix.ref == 'fix'
        run: bin/hxmc/hxmc -cp hxmc/test -cp haxe/test --run Corpus -v CoreDumpSize NullAccessCrash
